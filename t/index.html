<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Watersports</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/quest-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the page. A stylesheet from another origin holds
     up first paint until it answers, and when Google cannot be reached it does
     not fail fast — it sits for about twelve seconds and then resets. On shop
     wifi that is twelve seconds of a mechanic looking at "Starting up…". The
     media/onload swap lets the page paint immediately in the fallback stack
     and take the webfont whenever it turns up. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<!--
  The QR code stamped on every work order points here, and thousands of those
  are printed on paper that cannot be recalled. So this address has to keep
  answering forever, and answer something sensible to whoever opens it.

  A mechanic scanning it does not land here: the mechanic app reads the token
  out of the QR and opens the job in /m/. The only person who reaches this page
  is someone pointing a plain camera at a work order — which, in practice, is a
  customer. They get the shop's phone number, which is what they actually
  wanted, and nothing else.

  The backend that once served a job to this page is still there and still
  guarded by customerView_ and publicJob, so the boundary tests still mean
  something. Nothing calls it from here any more.
-->
<header class="tracker-head">
  <div class="inner">
    <img src="../assets/quest-mark.png" alt="">
    <div>
      <div class="co">Quest Watersports</div>
      <div class="sub">Ottawa, IL</div>
    </div>
  </div>
</header>

<main class="wrap narrow">
  <section class="card" style="margin-top:22px;text-align:center">
    <h2>This code is for the shop</h2>
    <p class="lead" style="margin:10px auto 0">
      It is how our technicians pull your boat's work order up on their phones.
    </p>
    <p class="lead" style="margin:14px auto 0">
      Wondering how your boat is getting on? Give us a call and we will tell you.
    </p>
    <p style="margin:18px 0 4px">
      <a class="btn navy big" href="tel:+18154332200">815-433-2200</a>
    </p>
    <p class="hint" style="margin-top:14px">
      <a href="mailto:service@questwatersports.com">service@questwatersports.com</a>
    </p>
  </section>
</main>
</body>
</html>
