<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Shop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14293E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quest Shop">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the page. A stylesheet from another origin holds
     up first paint until it answers, and when Google cannot be reached it does
     not fail fast — it sits for about twelve seconds and then resets. On shop
     wifi that is twelve seconds of a mechanic looking at "Starting up…". The
     media/onload swap lets the page paint immediately in the fallback stack
     and take the webfont whenever it turns up. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body class="mech-body">
<div class="mech">
  <!-- Navigation lives out here with the footer, for the same reason: every
       screen redraws #view, and the way out must not depend on the screen you
       are trying to get out of having drawn correctly. -->
  <div class="mech-top">
    <button type="button" id="navback" class="navbtn" hidden>&lsaquo; Back</button>
    <img src="../assets/quest-mark.png" alt="" style="height:30px;border-radius:6px">
    <a href="./" class="topname" style="text-decoration:none;color:#fff"><div class="t">Quest Shop</div></a>
    <button type="button" id="navhome" class="navbtn">Home</button>
  </div>
  <main id="view"><p class="loading" style="color:#9fc3dc">Starting up…</p></main>
  <!-- Sits outside #view on purpose: every screen redraws that, and the one
       time this is needed most is the time a screen did not draw. A phone
       running a half-updated copy of the app looks wrong rather than broken,
       so nothing else on the page would offer a way out of it. -->
  <p class="mech-foot"><button type="button" id="updateapp">Update the app</button><span id="timing"></span></p>
</div>

<!-- A watchdog, deliberately NOT a module.
     If the module below fails to load at all — a bad deploy, a half-cached
     asset, a phone that has been offline for a month — nothing in it runs and
     the screen above stays on "Starting up…" forever. A mechanic standing in
     the shop with a dead app and no message is the worst version of any bug
     here, so this plain script watches for that and offers the one thing that
     reliably fixes it: throw away the service worker and everything it has
     cached, and load again. -->
<script>
  window.__questBooted = false;

  /**
   * Throw away the service worker and everything it has cached, then load
   * again. Lives out here rather than in the module because the watchdog
   * below has to be able to call it when the module is exactly what failed.
   */
  window.__questReset = function () {
    var steps = [];
    if (window.caches && caches.keys) {
      steps.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (key) { return caches.delete(key); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      steps.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
      }));
    }
    Promise.all(steps).catch(function () {}).then(function () {
      // A cache-busting query, because what is being recovered from can be a
      // stale copy of this very page.
      location.replace(location.pathname + '?fresh=' + Date.now());
    });
  };
  setTimeout(function () {
    if (window.__questBooted) return;
    var view = document.getElementById('view');
    if (!view) return;
    view.innerHTML =
      '<div class="card"><h2>The app did not start</h2>' +
      '<p class="hint">This is usually an update that half-arrived. Clearing what the phone has ' +
      'stored and loading again fixes it. Nothing you have logged is on the phone, so nothing ' +
      'is lost.</p>' +
      '<button class="btn navy big block" type="button" id="resetapp">Clear and try again</button></div>';
    document.getElementById('resetapp').onclick = window.__questReset;
  }, 8000);
</script>

<script type="module">
import { api, ApiError, storeSession, storedWho, clearSession, storedToken, onApiTiming } from '../assets/lib/api.js';
import { ENTRY_LABEL, formatHours, formatMinutes } from '../assets/lib/entry-types.js';
import { tokenFromScan } from '../assets/lib/tracking.js';
import { $, esc, toast, formatDateTime, fileToBase64, preparePhoto, driveImageUrl, driveFileUrl } from '../assets/lib/ui.js';

// The module evaluated, so the watchdog above has nothing to recover from.
window.__questBooted = true;

$('navback').onclick = () => { if (state.back) state.back(); };
$('navhome').onclick = () => { state.job = null; state.jobFrom = null; renderHome(); };

/**
 * The last call's timing, in the footer where it is out of the way.
 *
 * A mechanic saying "it is slow" and a number saying 4.2s, 0.6s of it in the
 * sheet, are different amounts of help. Only shown once a call has been made,
 * and only the total unless the backend reported its own share.
 */
onApiTiming((call) => {
  const box = $('timing');
  // The warm-up is not a call the mechanic made, and its time would sit in
  // the footer describing nothing they did.
  if (!box || call.fn === 'ping') return;
  const secs = (ms) => `${(ms / 1000).toFixed(1)}s`;
  box.textContent = call.serverMs === null
    ? secs(call.ms)
    : `${secs(call.ms)} · ${secs(call.serverMs)} in the sheet`;
});

$('updateapp').onclick = () => {
  const button = $('updateapp');
  button.disabled = true;
  button.textContent = 'Updating…';
  window.__questReset();
};

if ('serviceWorker' in navigator) {
  // updateViaCache: 'none' — the worker script itself must never come from the
  // HTTP cache, or a broken generation could keep re-serving the worker that
  // is keeping it broken.
  addEventListener('load', () => navigator.serviceWorker
    .register('../sw.js', { updateViaCache: 'none' }).catch(() => {}));
}

const view = $('view');

// Delegated, and bound once: #fields is rebuilt every time a tab changes, so
// per-field handlers would have to be re-attached on every redraw. What this
// keeps live is the tab strip's marks and the count on the save button.
view.addEventListener('input', () => drawSaveButton());
view.addEventListener('change', () => drawSaveButton());

/**
 * Says where Back goes from the screen about to be drawn, and shows or hides
 * the button accordingly. Home is always available and always means the scan
 * screen; Back is only offered when there is somewhere to go.
 */
function screen(backTo) {
  state.back = backTo || null;
  const button = $('navback');
  if (button) button.hidden = !state.back;
}
const state = {
  who: storedWho(),
  roster: [],
  job: null,
  // What is on screen: the fetched log, plus anything saved since. Opening a
  // job no longer brings the log with it, so `logLoaded` says whether these
  // are all of it or only the entries this phone has just written.
  entries: [],
  logLoaded: false,
  tab: 'labor',
  // One draft per tab, so a mechanic can fill in the hours, scan a part and
  // write a note in any order and lose none of it by looking at another tab.
  // A single shape covers all four; each tab uses the keys it needs.
  drafts: {},
  // null until the Prop tab is opened, which is the only place they are drawn.
  props: null,
  tagPhoto: null,
  scanning: null,
  // What Back does from here, and where the job screen should send you —
  // the list if you picked it off one, the scan screen if you scanned it.
  back: null,
  jobFrom: null,
};

/**
 * What is typed into one tab, kept while the mechanic is looking at another.
 *
 * The strip used to be four forms sharing one set of fields: switching tabs
 * redrew them empty, so a part number scanned before the hours were entered
 * was simply gone. Each tab has its own draft now, everything with anything
 * in it is saved by the one button, and the tab strip marks the ones holding
 * something so nothing is saved by surprise or forgotten in silence.
 */
function blankDraft() {
  return {
    text: '', audio: null, photos: [],
    hours: '', minutes: '',
    part: '', qty: '', needorder: false, orderqty: '', needrestock: false, restockqty: '',
    tagPhoto: null, description: '',
  };
}

function draft(tab) {
  const key = tab || state.tab;
  if (!state.drafts[key]) state.drafts[key] = blankDraft();
  return state.drafts[key];
}

function clearDrafts() {
  state.drafts = {};
}

/** Whether a tab is holding anything a save should pick up. */
function draftHasSomething(tab) {
  const d = draft(tab);
  const typed = (value) => Boolean(String(value || '').trim());
  if (tab === 'prop') return Boolean(d.tagPhoto || typed(d.description));
  if (tab === 'labor') {
    return Boolean(Number(d.hours) || Number(d.minutes) || typed(d.text) || d.audio || d.photos.length);
  }
  if (tab === 'part') {
    return Boolean(typed(d.part) || typed(d.qty) || typed(d.text) || d.audio || d.photos.length ||
      d.needorder || d.needrestock);
  }
  return Boolean(typed(d.text) || d.audio || d.photos.length);
}

function filledTabs() {
  return TABS.map(([value]) => value).filter(draftHasSomething);
}

/**
 * Reads the fields on screen back into the current tab's draft.
 *
 * Called before anything redraws or saves. The hours, the photos and the
 * recording already live in the draft as they are entered; these are the
 * boxes that only exist in the DOM until somebody asks.
 */
function captureDraft() {
  const d = draft();
  if (state.tab === 'prop') {
    if ($('propdesc')) d.description = $('propdesc').value;
    return;
  }
  if ($('text')) d.text = $('text').value;
  if (state.tab === 'part') {
    if ($('part')) d.part = $('part').value;
    if ($('qty')) d.qty = $('qty').value;
    if ($('needorder')) d.needorder = $('needorder').checked;
    if ($('orderqty')) d.orderqty = $('orderqty').value;
    if ($('needrestock')) d.needrestock = $('needrestock').checked;
    if ($('restockqty')) d.restockqty = $('restockqty').value;
  }
}

/* ------------------------------------------------------------ scanner --- */

const NATIVE_FORMATS = {
  qr: ['qr_code'],
  any: ['qr_code', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'codabar'],
};

/**
 * Chrome on Android has a barcode detector built into the browser and it is
 * far faster than anything shipped in JavaScript. Safari — which is what the
 * shop iPad and half the phones run — has no such thing, so ZXing is loaded
 * on demand as the fallback. It is a big download, which is exactly why it is
 * not loaded until someone actually opens the camera.
 */
async function startScanner(element, mode, onResult) {
  let stream = null;
  let raf = 0;
  let reader = null;
  let stopped = false;
  const video = element.querySelector('video');

  const stop = () => {
    stopped = true;
    if (raf) cancelAnimationFrame(raf);
    if (reader) try { reader.reset(); } catch { /* already torn down */ }
    if (stream) stream.getTracks().forEach((track) => track.stop());
  };
  const finish = (value) => {
    if (stopped) return;
    stop();
    if (navigator.vibrate) navigator.vibrate(40);
    onResult(value);
  };
  const fail = (message) => {
    if (stopped) return;
    element.querySelector('.hintline').textContent = message;
  };

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    fail('This browser cannot open the camera. Type the number instead.');
    return stop;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
      audio: false,
    });
  } catch (error) {
    fail(error && error.name === 'NotAllowedError'
      ? 'Camera access was blocked. Allow it for this site, or type the number instead.'
      : 'Could not start the camera. Type the number instead.');
    return stop;
  }
  if (stopped) { stream.getTracks().forEach((t) => t.stop()); return stop; }

  video.srcObject = stream;
  video.setAttribute('playsinline', 'true');
  video.muted = true;
  try { await video.play(); } catch { /* Safari resolves late; the loop copes */ }

  if (window.BarcodeDetector) {
    const detector = new window.BarcodeDetector({ formats: NATIVE_FORMATS[mode] });
    const tick = async () => {
      if (stopped) return;
      try {
        const hits = await detector.detect(video);
        if (hits.length && hits[0].rawValue) return finish(hits[0].rawValue);
      } catch { /* a dropped frame is not worth showing anyone */ }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return stop;
  }

  try {
    const zxing = await import('../assets/vendor/zxing.min.js');
    const lib = zxing.default || zxing;
    if (stopped) return stop;
    const hints = new Map();
    hints.set(lib.DecodeHintType.POSSIBLE_FORMATS, mode === 'any'
      ? [lib.BarcodeFormat.QR_CODE, lib.BarcodeFormat.EAN_13, lib.BarcodeFormat.EAN_8,
         lib.BarcodeFormat.UPC_A, lib.BarcodeFormat.UPC_E, lib.BarcodeFormat.CODE_128,
         lib.BarcodeFormat.CODE_39, lib.BarcodeFormat.ITF, lib.BarcodeFormat.CODABAR]
      : [lib.BarcodeFormat.QR_CODE]);
    reader = new lib.BrowserMultiFormatReader(hints, 250);
    await reader.decodeFromStream(stream, video, (result) => {
      const text = result && result.getText();
      if (text) finish(text);
    });
  } catch {
    fail('The scanner could not start. Type the number instead.');
  }
  return stop;
}

function scannerHtml(hint) {
  return `<div class="scanner">
    <video playsinline muted></video>
    <div class="reticle"></div>
    <div class="hintline">${esc(hint)}</div>
  </div>`;
}

/* -------------------------------------------------------------- views --- */

function stopScanning() {
  if (state.scanning) { state.scanning(); state.scanning = null; }
}

function installBanner() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return '';
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    return `<div class="banner info" style="margin-bottom:14px">
      <b>Add this to your home screen:</b> tap the Share button below, then <b>Add to Home Screen</b>.
      You only have to do this once.</div>`;
  }
  return window.__installPrompt
    ? `<div class="banner info" style="margin-bottom:14px">
        <b>Add this to your home screen</b> so it opens like any other app.
        <button class="btn navy sm block" id="install" type="button" style="margin-top:10px">Install</button>
      </div>`
    : '';
}

let deferredInstall = null;
addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstall = event;
  window.__installPrompt = true;
  if (!state.job) renderHome();
});

function renderHome(message) {
  stopScanning();
  screen(null);
  view.innerHTML = `
    ${installBanner()}
    ${state.who ? `<p style="color:#9fc3dc;font-size:14px;margin-top:0">
      Signed in as <b style="color:#fff">${esc(state.who.name)}</b> ·
      <button type="button" class="linkbtn" style="padding:2px 8px;font-size:12px" id="signout">Not you?</button>
    </p>` : ''}
    ${message ? `<div class="banner warn" style="margin-bottom:14px">${esc(message)}</div>` : ''}
    <div class="stack">
      <button class="btn gold big block" type="button" id="scan">Scan work order</button>
      <button class="btn ghost big block" type="button" id="manual">Type invoice number instead</button>
      <button class="btn ghost big block" type="button" id="openjobs">Pick from open jobs</button>
      <button class="btn ghost block" type="button" id="reqpart">Request a part for stock</button>
      <p style="color:#9fc3dc;font-size:14px;line-height:1.5">
        Scan the QR code printed on the paper work order. Scanning starts the job — you will be
        asked who you are next.
      </p>
    </div>`;

  const install = $('install');
  if (install) install.onclick = async () => {
    if (!deferredInstall) return;
    await deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    window.__installPrompt = false;
    renderHome();
  };
  const signout = $('signout');
  if (signout) signout.onclick = () => { clearSession(); state.who = null; renderHome(); };
  $('scan').onclick = renderScanning;
  $('manual').onclick = renderManual;
  $('openjobs').onclick = renderOpenJobs;
  $('reqpart').onclick = renderPartRequest;
}

/**
 * Every boat still on the floor, for when the mechanic has neither the paper
 * nor the number.
 *
 * The list is behind the roster: one job looked up by its number means you
 * are holding the work order, but the whole list is every customer's name
 * and boat at once. So an unsigned mechanic is sent to sign in first and
 * brought straight back here.
 */
async function renderOpenJobs() {
  stopScanning();
  screen(renderHome);
  if (!state.who) return signInThen(renderOpenJobs);

  view.innerHTML = `<p class="loading" style="color:#9fc3dc">Loading open jobs…</p>`;
  let jobs;
  try {
    jobs = (await api('openJobs', [])).jobs;
  } catch (error) {
    // A remembered session that has since expired.
    if (/Sign in/i.test(error.message)) {
      state.who = null;
      return signInThen(renderOpenJobs);
    }
    return renderHome(error.message);
  }

  view.innerHTML = `
    <h2 style="margin:0 0 10px;color:#fff">Open jobs (${jobs.length})</h2>
    ${jobs.length ? `<div class="stack">
      ${jobs.map((job, index) => `
        <button class="btn ghost block joblist${job.alert ? ' flagged' : ''}" type="button" data-pick="${index}"
                style="text-align:left;padding:14px">
          <div style="font-family:var(--mono);font-weight:bold">${esc(job.id)}</div>
          <div style="font-size:15px;margin-top:2px">${esc(job.customerName || '(no name)')}</div>
          <div style="font-size:14px;opacity:.8">${esc(job.boatInfo || '(no boat details)')}</div>
          ${job.alert ? `<div style="margin-top:7px"><span class="alertflag">${ALERT_MARK} Read first</span></div>
            <div style="font-size:14px;line-height:1.4;color:var(--alert);font-weight:600;margin-top:5px">${esc(job.alert)}</div>`
          : `<div style="font-size:12px;opacity:.7;margin-top:4px">${esc(job.statusLabel)}</div>`}
        </button>`).join('')}
    </div>` : `<p style="color:#9fc3dc">Nothing open right now.</p>`}`;

  view.querySelectorAll('[data-pick]').forEach((button) => {
    button.onclick = () => {
      const job = jobs[Number(button.dataset.pick)];
      // Picking off the list is not scanning the paper, so it does not start
      // the job — opening it does what a scan would have done next.
      state.jobFrom = renderOpenJobs;
      state.job = { id: job.id, token: job.token, boatInfo: job.boatInfo,
                    customerName: job.customerName, workRequested: job.workRequested,
                    alert: job.alert, status: job.status, statusLabel: job.statusLabel };
      // loadJob, not renderJob: the log and the hours have to come with it.
      loadJob();
    };
  });
}

/**
 * A part for the shelf, with no job behind it — somebody noticing stock is
 * low. The part number is asked for plainly; the form goes through without
 * one, because a description and an empty hook is still worth putting on the
 * list.
 */
function renderPartRequest() {
  stopScanning();
  screen(renderHome);
  view.innerHTML = `<form class="card" id="form">
    <h2>Request a part for stock</h2>
    <div id="notice"></div>
    <label class="fld" for="pnum">Part number</label>
    <input class="txt mono" id="pnum" autofocus placeholder="Scan or type">
    <button class="btn ghost sm block" type="button" id="scanreq" style="margin-top:8px">Scan the barcode</button>
    <div id="reqscanner"></div>
    <label class="fld" for="pdesc">What is it</label>
    <input class="txt" id="pdesc" placeholder="Impeller kit, 3.0L">
    ${qtyField('pqty', 'How many')}
    <label class="fld" for="pnote">Note (optional)</label>
    <input class="txt" id="pnote" placeholder="Down to the last one">
    <div class="row" style="margin-top:14px">
      <button class="btn navy" type="submit">Add to the parts list</button>
      <button class="btn ghost" type="button" id="back">Back</button>
    </div>
  </form>`;

  $('back').onclick = () => renderHome();
  bindQtySteppers(view);
  $('scanreq').onclick = () => {
    const holder = $('reqscanner');
    if (state.scanning) { stopScanning(); holder.innerHTML = ''; return; }
    holder.innerHTML = `<div style="margin-top:10px">${scannerHtml('Line up the barcode on the box')}</div>`;
    startScanner(holder.querySelector('.scanner'), 'any', (value) => {
      $('pnum').value = value;
      holder.innerHTML = '';
    }).then((stop) => { state.scanning = stop; });
  };

  $('form').onsubmit = async (event) => {
    event.preventDefault();
    const button = event.target.querySelector('button[type=submit]');
    const draft = {
      partIdentifier: $('pnum').value,
      description: $('pdesc').value,
      quantity: $('pqty').value,
      notes: $('pnote').value,
    };
    button.disabled = true;
    try {
      // A request belongs to somebody, same as a log entry does.
      if (!state.who || !storedToken()) return signInThen(() => sendPartRequest(draft));
      await sendPartRequest(draft);
    } catch (error) {
      button.disabled = false;
      $('notice').innerHTML = `<div class="banner warn" style="margin-bottom:12px">${esc(error.message)}</div>`;
    }
  };
}

async function sendPartRequest(draft) {
  await api('requestPart', [draft]);
  renderHome();
  toast('On the parts list.');
}

/** Sign in, then carry on with whatever the person was doing. */
async function signInThen(next) {
  view.innerHTML = `<div class="card"><p class="loading">Loading the crew list…</p></div>`;
  try {
    state.roster = (await api('roster', [])).roster;
  } catch {
    state.roster = [];
  }
  state.afterSignIn = next;
  drawSignIn(false, null);
}

function renderScanning() {
  warm();
  stopScanning();
  view.innerHTML = `<div class="stack">
    ${scannerHtml('Line up the QR code on the work order')}
    <button class="btn ghost block" type="button" id="cancel">Cancel</button>
    <button class="btn ghost block" type="button" id="manual">Type invoice number instead</button>
  </div>`;
  $('cancel').onclick = () => renderHome();
  $('manual').onclick = renderManual;

  startScanner(view.querySelector('.scanner'), 'qr', (value) => {
    const token = tokenFromScan(value);
    if (!token) return renderHome('That code is not a Quest work order. Try again, or type the invoice number.');
    openJob(token, 'scan');
  }).then((stop) => { state.scanning = stop; });
}

function renderManual() {
  warm();
  stopScanning();
  screen(renderHome);
  view.innerHTML = `<form class="card" id="form">
    <h2>Invoice number</h2>
    <input class="txt mono" id="code" inputmode="text" autofocus placeholder="01-8886">
    <p class="hint">It is printed at the top of the work order, next to the QR code.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn navy" type="submit">Open job</button>
      <button class="btn ghost" type="button" id="back">Back</button>
    </div>
  </form>`;
  $('back').onclick = () => renderHome();
  $('form').onsubmit = (event) => {
    event.preventDefault();
    const code = $('code').value.trim();
    if (code) openJob(code, 'manual');
  };
}

async function openJob(code, source) {
  state.jobFrom = renderHome;
  view.innerHTML = `<p class="loading" style="color:#9fc3dc">Looking that job up…</p>`;
  try {
    const data = await api('lookupJob', [code, source]);
    state.job = data.job;
    // Signed in already, so the log came back with the lookup rather than
    // costing a second trip to the backend. That second call was most of the
    // wait between scanning the paper and seeing the job.
    if (data.mechanic) {
      state.who = data.mechanic;
      state.hours = data.hours;
      state.entries = [];
      state.logLoaded = false;
      state.props = null;
      return renderJob();
    }
    if (state.who && storedToken()) return loadJob();
    renderSignIn();
  } catch (error) {
    renderHome(error.message);
  }
}

/* ------------------------------------------------------------ sign in --- */

async function renderSignIn() {
  view.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="kv"><span class="k">Job</span><b style="font-family:var(--mono)">${esc(state.job.id)}</b></div>
      <div class="kv"><span class="k">Boat</span><b>${esc(state.job.boatInfo || '—')}</b></div>
      ${state.job.workRequested ? `<div style="margin-top:10px">
        <div class="k" style="margin-bottom:4px">What needs doing</div>
        <div style="font-size:15px;line-height:1.5">${esc(state.job.workRequested)}</div>
      </div>` : ''}
    </div>
    <div class="card"><p class="loading">Loading the crew list…</p></div>`;

  try {
    state.roster = (await api('roster', [])).roster;
  } catch {
    state.roster = [];
  }
  drawSignIn(false, null);
}

function drawSignIn(typing, error) {
  const card = view.querySelector('.card:last-child');
  card.innerHTML = `
    <h2>Who is working this job?</h2>
    ${error ? `<div class="banner warn" style="margin-bottom:12px">${esc(error)}</div>` : ''}
    ${!typing && state.roster.length ? `
      <div class="namegrid">
        ${state.roster.map((m) => `<button type="button" data-name="${esc(m.name)}">${esc(m.name)}</button>`).join('')}
      </div>
      <button class="btn ghost block" type="button" id="other" style="margin-top:10px">My name is not here</button>
    ` : `
      <form id="nameform">
        <label class="fld" for="name">Your name</label>
        <input class="txt" id="name" autocomplete="name" autocapitalize="words" placeholder="Dale Hopkins" autofocus>
        <button class="btn navy big block" type="submit" style="margin-top:12px">Start logging</button>
        ${state.roster.length ? `<button class="btn ghost block" type="button" id="backlist" style="margin-top:10px">Back to the list</button>` : ''}
      </form>
    `}
    <label class="checkline">
      <input type="checkbox" id="remember" checked>
      <span>Remember me on this device
        <small>Leave this off on the shop iPad — it forgets you at the end of the shift.</small></span>
    </label>`;

  const remember = () => $('remember').checked;
  card.querySelectorAll('.namegrid button').forEach((button) => {
    button.onclick = () => signIn(button.dataset.name, remember());
  });
  const other = $('other');
  if (other) other.onclick = () => drawSignIn(true, null);
  const backlist = $('backlist');
  if (backlist) backlist.onclick = () => drawSignIn(false, null);
  const form = $('nameform');
  if (form) form.onsubmit = (event) => {
    event.preventDefault();
    const name = $('name').value.trim();
    if (name) signIn(name, remember());
  };
}

async function signIn(name, remember) {
  try {
    const result = await api('signIn', [name, remember]);
    storeSession(result.token, result.mechanic, remember);
    state.who = result.mechanic;
    if (state.afterSignIn) {
      const next = state.afterSignIn;
      state.afterSignIn = null;
      return next();
    }
    loadJob();
  } catch (error) {
    drawSignIn(true, error.message);
  }
}

/* --------------------------------------------------------- job screen --- */

async function loadJob() {
  stopScanning();
  screen(state.jobFrom || renderHome);
  view.innerHTML = state.job && state.job.id
    ? `${jobHeadHtml(state.job, 'Opening the job…')}
       <p class="loading" style="color:#9fc3dc">Loading the log…</p>`
    : `<p class="loading" style="color:#9fc3dc">Opening the job…</p>`;
  try {
    const data = await api('jobForMechanic', [state.job.token]);
    state.who = data.mechanic;
    state.job = data.job;
    state.hours = data.hours;
    state.entries = [];
    state.logLoaded = false;
    state.props = null;
    renderJob();
  } catch (error) {
    if (error instanceof ApiError && /Sign in/.test(error.message)) {
      state.who = null;
      return renderSignIn();
    }
    renderHome(error.message);
  }
}

const TAB_HELP = {
  internal_note: 'What you found, what you did, anything the writer should know.',
  labor: 'Your time and what you did with it — this is what gets billed.',
  part: 'What you fitted, and whether any needs ordering or putting back on the shelf.',
  prop: 'A prop coming off this boat to go out for repair. Photograph the tag.',
};
// Hours first: it is what a mechanic reaches for most, and the one thing the
// writer cannot reconstruct afterwards. Customer notes are gone — everything
// logged here is the shop's own record. (The type still exists in the
// backend, unused, so the customer page can be brought back without one.)
const TABS = [
  ['labor', 'Hours'],
  ['part', 'Parts'],
  ['internal_note', 'Notes'],
  // Not a log entry — a prop leaving the building. It shares the strip
  // because that is where a mechanic looks for "the thing I do next", and
  // splitting it into its own card put it below the log where nobody scrolled.
  ['prop', 'Prop'],
];
const TAB_LABEL = TABS.reduce((out, [value, label]) => Object.assign(out, { [value]: label }), {});
// The chips a mechanic actually reaches for, in minutes. A quarter hour is
// the smallest stint anybody books, and anything past four hours gets typed.
const TIME_STEPS = [15, 30, 45, 60, 120, 240];
// Inline SVG rather than an emoji: the warning triangle renders as a different
// glyph, and sometimes a colour, on every phone in the shop.
const ALERT_MARK = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"
  style="flex:none"><path fill="currentColor" d="M12 2.6 1.2 21.4h21.6L12 2.6Zm0 5.6a1 1 0 0 1 1 1v5a1 1 0
  0 1-2 0v-5a1 1 0 0 1 1-1Zm0 8.4a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg>`;

function entryHtml(entry) {
  const pill = { customer_note: 'green', internal_note: 'blue', writer_note: 'gold', labor: 'frost', part: 'gold' }[entry.entryType];
  let body = '';
  // Typed and spoken are two different things a mechanic said, and an entry
  // can carry both. The transcript is labelled because it is a machine's
  // guess at what was said and the shop is meant to read it as one.
  if (entry.text) body = `<div class="body">${esc(entry.text)}</div>`;
  if (entry.transcript) body += `<div class="body said"><span class="saidtag">Said</span>${esc(entry.transcript)}</div>`;
  else if (entry.transcriptStatus === 'pending') body += `<div class="body pending">Voice note — transcribing…</div>`;
  else if (entry.transcriptStatus === 'failed') {
    body += `<div class="body pending">Voice note — transcription failed${entry.transcriptError ? ` (${esc(entry.transcriptError)})` : ''}. The recording is below.</div>`;
  }
  return `<article class="entry ${entry.entryType}${entry.saveState ? ` ${entry.saveState}` : ''}">
    ${entry.saveState === 'saving' ? '<div class="savestate">Saving…</div>' : ''}
    ${entry.saveState === 'failed' ? `<div class="savestate bad">Not saved${entry.saveError ? ` — ${esc(entry.saveError)}` : ''}
      <button type="button" data-retry="${esc(entry.id)}">Try again</button></div>` : ''}
    <div class="meta">
      <span class="pill ${pill}">${esc(ENTRY_LABEL[entry.entryType])}</span>
      <span>${esc(entry.mechanicName || 'Unknown')}</span><span>·</span>
      <time datetime="${esc(entry.createdAt)}">${formatDateTime(entry.createdAt)}</time>
    </div>
    ${entry.entryType === 'part' ? `<div class="partline">${esc(entry.partIdentifier || '(no identifier)')}${entry.quantity ? ` × ${entry.quantity}` : ''}</div>` : ''}
    ${entry.entryType === 'labor' && entry.hours !== null ? `<div class="hoursline">${formatHours(entry.hours)}</div>` : ''}
    ${body}
    ${entry.audioFile ? `<div class="audiorow">
      <a href="${driveFileUrl(entry.audioFile)}" target="_blank" rel="noreferrer">Open the recording in Drive</a>
    </div>` : ''}
    ${entry.localPhotos && entry.localPhotos.length ? `<div class="photos">${entry.localPhotos.map((p) => `
      <img src="data:image/jpeg;base64,${p.thumb}" alt="Job photo">`).join('')}</div>` : ''}
    ${entry.photos.length ? `<div class="photos">${entry.photos.map((p) => `
      <a href="${driveImageUrl(p.full, 1600)}" target="_blank" rel="noreferrer">
        <img src="${driveImageUrl(p.thumb, 400)}" alt="Job photo" loading="lazy"></a>`).join('')}</div>` : ''}
  </article>`;
}

/**
 * The log itself, drawable on its own so a finished save need not redraw the
 * form — and drawable before the log has been fetched at all.
 *
 * Opening a job does not bring the entries with it: one job's log means
 * reading every entry in the shop, and that was the biggest thing a mechanic
 * waited for on a screen they had opened to write, not to read. The count
 * comes off the job row instead, so the card is honest about what is there
 * and fetches it when it is asked for. Anything saved since shows straight
 * away, fetched or not.
 */
function hiddenEntries() {
  if (state.logLoaded) return 0;
  const settled = state.entries.filter((entry) => !entry.saveState).length;
  return Math.max(Number((state.job && state.job.entryCount) || 0) - settled, 0);
}

function feedHtml() {
  const hidden = hiddenEntries();
  const total = hidden + state.entries.length;
  return `<h2>Job log (${total})</h2>
    ${state.entries.length ? `<div class="feed">${state.entries.map(entryHtml).join('')}</div>` : ''}
    ${hidden ? `<button class="btn ghost block" type="button" id="showlog"${
        state.entries.length ? ' style="margin-top:12px"' : ''}>${
      state.entries.length
        ? `Show the ${hidden} earlier ${hidden === 1 ? 'entry' : 'entries'}`
        : `Show the log (${hidden})`}</button>`
      : total ? '' : `<div class="empty">Nothing logged yet.</div>`}`;
}

/**
 * Fetches the log, and merges rather than replaces: an entry saved a moment
 * ago is already on screen and may still be in flight, and it must not
 * vanish because the fetch went out first.
 */
async function loadLog() {
  const button = $('showlog');
  if (button) {
    button.disabled = true;
    button.textContent = 'Loading the log…';
  }
  try {
    const data = await api('jobLog', [state.job.token]);
    const fetched = new Set(data.entries.map((entry) => entry.id));
    state.entries = data.entries.concat(state.entries.filter((entry) => !fetched.has(entry.id)));
    state.hours = data.hours;
    state.logLoaded = true;
    drawFeed();
    drawHint();
  } catch (error) {
    if (button) {
      button.disabled = false;
      button.textContent = 'Show the log';
    }
    toast(error.message);
  }
}

function bindFeed() {
  view.querySelectorAll('[data-recheck]').forEach((button) => {
    button.onclick = () => {
      button.textContent = 'Checking…';
      // Attempt 0 waits two seconds, which reads as instant next to a button
      // that has just changed its own label.
      watchTranscript(button.dataset.recheck, 0);
    };
  });
  view.querySelectorAll('[data-retry]').forEach((button) => {
    button.onclick = () => {
      const entry = state.entries.find((e) => e.id === button.dataset.retry);
      if (entry) retryEntry(entry);
    };
  });
  const showlog = $('showlog');
  if (showlog) showlog.onclick = loadLog;
}

function drawFeed() {
  const box = $('joblog');
  if (!box) return;
  box.innerHTML = feedHtml();
  bindFeed();
}

/** The "logging as … · so far" line, which a finished save moves. */
function drawHint() {
  const hint = $('jobhint');
  if (!hint || !state.who) return;
  hint.innerHTML = `Logging as <b>${esc(state.who.name)}</b>${
    state.hours && state.hours.total ? ` · ${formatHours(state.hours.total)} on this job so far` : ''}`;
}

/**
 * The top of the job screen: the alert first, then who and what the boat is.
 *
 * Split out so the screen can be drawn from what the open-jobs list already
 * knows, the moment the mechanic taps a job, instead of a blank page and the
 * word "Opening". The log arrives a beat later and the rest fills in — but
 * the alert, which is the one thing that has to be read before work starts,
 * is on screen straight away.
 */
function jobHeadHtml(job, hint) {
  return `
    ${job.alert ? `<div class="alertbanner" role="alert" data-alert>
      <div class="tag">${ALERT_MARK} Read this first</div>
      <div class="msg">${esc(job.alert)}</div>
      ${job.alertAt ? `<div class="when">From the office · ${formatDateTime(job.alertAt)}</div>` : ''}
    </div>` : ''}
    <div class="card" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between">
        <div>
          <div style="font-family:var(--mono);font-size:18px;font-weight:600;color:var(--navy)">${esc(job.id)}</div>
          <div style="font-size:14px;color:var(--muted)">${esc(job.boatInfo || 'No boat details')}${job.customerName ? ` · ${esc(job.customerName)}` : ''}</div>
        </div>
        ${job.statusLabel ? `<span class="pill frost">${esc(job.statusLabel)}</span>` : ''}
      </div>
      <p class="hint" id="jobhint" style="margin-top:8px">${hint}</p>
      ${job.workRequested ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--ice)">
        <div class="fld" style="margin:0 0 4px">What needs doing</div>
        <div style="font-size:15px;line-height:1.5;color:var(--navy)">${esc(job.workRequested)}</div>
      </div>` : ''}
    </div>`;
}

function renderJob() {
  stopScanning();
  screen(state.jobFrom || renderHome);
  const job = state.job;
  const finished = job.status === 'work_finished' || job.status === 'done';
  view.innerHTML = `
    ${jobHeadHtml(job, `Logging as <b>${esc(state.who.name)}</b>${state.hours && state.hours.total ? ` · ${formatHours(state.hours.total)} on this job so far` : ''}`)}

    <div id="notice"></div>

    <section class="card" style="margin-bottom:14px">
      <h2>Add to the log</h2>
      <div class="segmented" style="margin-bottom:12px">
        ${TABS.map(([value, label]) => `<button type="button" data-tab="${value}" class="${
          [state.tab === value ? 'on' : '', draftHasSomething(value) ? 'filled' : ''].filter(Boolean).join(' ')
        }">${label}</button>`).join('')}
      </div>
      <p class="hint" style="margin-top:0">${esc(TAB_HELP[state.tab])}</p>
      <div id="fields"></div>

      ${state.tab === 'prop' ? '' : `
      <label class="fld" for="text">${state.tab === 'part' ? 'Note about this part (optional)' : state.tab === 'labor' ? 'What you did with that time — type it or say it' : 'Note — type it or say it'}</label>
      <textarea class="txt" id="text" placeholder="${state.tab === 'labor' ? 'Pulled and reset the impeller housing, re-torqued the mounts…' : 'What did you find or do?'}">${esc(draft().text)}</textarea>

      <div style="margin-top:12px" id="recorder"></div>

      <label class="fld">Photos</label>
      <!-- Two buttons and two hidden inputs, rather than one input and a
           choice. Whether a bare file input offers "camera or library" is up
           to the phone: the shop's opened straight into the gallery, and
           before that the capture attribute sent it straight into the
           camera. Neither
           gave the mechanic the choice, so the choice is made explicit here
           and the OS is only ever asked for one specific thing.
           Neither input is the QR scanner, which is a live getUserMedia
           stream and untouched by any of this.
           (No backticks in here: this comment sits inside a template
           literal, and one would end the string.) -->
      <div class="row tight">
        <button class="btn ghost block" type="button" id="takephoto">Take a photo</button>
        <button class="btn ghost block" type="button" id="pickphoto">Choose a photo</button>
      </div>
      <input id="photocamera" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="photolibrary" type="file" accept="image/*" multiple class="hidden">
      <div class="thumbrow" id="thumbs"></div>`}

      <button class="btn navy big block" type="button" id="save" style="margin-top:16px"></button>
      <p class="hint" id="savehint" style="margin-top:8px"></p>
    </section>

    <section class="card" style="margin-bottom:14px" id="joblog">${feedHtml()}</section>

    ${finished ? `<div class="banner ok">Marked finished. You can still add notes if something else comes up.</div>`
      : `<section class="card">
          <h2>When you are done</h2>
          <button class="btn green big block" type="button" id="finish">Work finished</button>
        </section>`}

    <p style="margin-top:18px"><a href="./" id="another">Scan another work order</a></p>`;

  view.querySelectorAll('.segmented button').forEach((button) => {
    button.onclick = () => {
      // Read the fields back before they are redrawn, or a part number typed
      // on the way to the Hours tab is gone.
      captureDraft();
      state.tab = button.dataset.tab;
      renderJob();
    };
  });
  $('another').onclick = (event) => { event.preventDefault(); state.job = null; renderHome(); };

  bindFeed();
  const finish = $('finish');
  if (finish) finish.onclick = confirmFinish;
  // A prop is not a log entry, so the one button at the bottom of the card
  // does the thing the current tab is for.
  $('save').onclick = saveEntry;
  // drawFields() builds the prop tab's own controls, so everything below only
  // exists on the three tabs that write a log entry.
  if (state.tab !== 'prop') {
    // Both feed the same handler: what differs is only which door the phone
    // opens. The camera takes one shot at a time, so it carries no `multiple`.
    $('photocamera').onchange = onPhotos;
    $('photolibrary').onchange = onPhotos;
    $('takephoto').onclick = () => $('photocamera').click();
    $('pickphoto').onclick = () => $('photolibrary').click();
  }
  drawFields();
  if (state.tab !== 'prop') {
    drawRecorder();
    drawThumbs();
  }
  drawSaveButton();
}

/**
 * What the one button is about to save, said on the button.
 *
 * With four tabs each holding their own draft, "Save entry" is not enough:
 * the mechanic has to be able to see that the part they scanned two tabs ago
 * is going with this tap, and equally that it is not being sent by accident.
 */
function drawSaveButton() {
  const button = $('save');
  if (!button) return;
  captureDraft();
  const filled = filledTabs();
  const hint = $('savehint');

  // Mark the tabs holding something, without redrawing the fields underneath.
  view.querySelectorAll('.segmented button').forEach((tab) => {
    tab.classList.toggle('filled', draftHasSomething(tab.dataset.tab));
  });

  if (filled.length > 1) {
    button.textContent = `Save all ${filled.length}`;
    if (hint) hint.textContent = 'Saving ' + filled.map((tab) => TAB_LABEL[tab]).join(', ') + '.';
    return;
  }
  const only = filled[0] || state.tab;
  button.textContent = only === 'prop' ? 'Ready for pick-up' : 'Save entry';
  if (hint) hint.textContent = '';
}

/**
 * A quantity box with minus and plus either side, stepping by one.
 *
 * Separate from the time steppers on purpose: those move a pair of boxes as
 * one duration and carry between them, these move one box on its own. The
 * markup is shared, the behaviour is not, so the buttons carry data-qty and
 * the time ones do not.
 */
function qtyField(id, label, value) {
  return `
    <label class="fld" for="${id}">${label}</label>
    <div class="stepper">
      <button type="button" data-qty="${id}" data-by="-1" aria-label="One fewer">&minus;</button>
      <input class="txt mono" id="${id}" inputmode="decimal" placeholder="1" value="${esc(value || '')}">
      <button type="button" data-qty="${id}" data-by="1" aria-label="One more">+</button>
    </div>`;
}

function bindQtySteppers(root) {
  root.querySelectorAll('.stepper button[data-qty]').forEach((button) => {
    button.onclick = () => {
      const field = $(button.dataset.qty);
      if (!field) return;
      const next = (Number(field.value) || 0) + Number(button.dataset.by);
      // Below one is not a quantity, it is "no number given" — which the
      // optional box is entitled to be, and which the save reads as one.
      // Rounded because a mechanic may well have typed 1.5 quarts.
      field.value = next < 1 ? '' : String(Math.round(next * 100) / 100);
    };
  });
}

/** The two boxes as one figure in whole minutes. */
function timeTotal() {
  const d = draft('labor');
  return (Number(d.hours) || 0) * 60 + (Number(d.minutes) || 0);
}

/** And back again, carrying into hours. Never below zero. */
function setTimeTotal(total) {
  const whole = Math.max(0, Math.round(total));
  const d = draft('labor');
  d.hours = String(Math.floor(whole / 60));
  d.minutes = String(whole % 60);
  if ($('hours')) $('hours').value = d.hours;
  if ($('minutes')) $('minutes').value = d.minutes;
  drawSaveButton();
}

function drawFields() {
  const box = $('fields');
  if (state.tab === 'labor') {
    box.innerHTML = `
      <label class="fld">Time on this job</label>
      <div class="hm">
        <div>
          <div class="stepper">
            <button type="button" data-by="-60" aria-label="An hour less">&minus;</button>
            <input class="txt mono" id="hours" inputmode="numeric" placeholder="0"
              value="${esc(draft('labor').hours || '')}" aria-label="Hours">
            <button type="button" data-by="60" aria-label="An hour more">+</button>
          </div>
          <span>hours</span>
        </div>
        <div>
          <div class="stepper">
            <button type="button" data-by="-5" aria-label="Five minutes less">&minus;</button>
            <input class="txt mono" id="minutes" inputmode="numeric" placeholder="0"
              value="${esc(draft('labor').minutes || '')}" aria-label="Minutes">
            <button type="button" data-by="5" aria-label="Five minutes more">+</button>
          </div>
          <span>minutes</span>
        </div>
      </div>
      <div class="hourchips">${TIME_STEPS.map((m) => `<button type="button" data-m="${m}">${formatMinutes(m)}</button>`).join('')}</div>
      <p class="hint">Log the time as you finish a stint. Several entries in a day is normal — they add up on the job.</p>`;
    // A chip sets the whole figure rather than adding to it: tapping "30m"
    // after typing 2 in the hours box means thirty minutes, not two and a half
    // hours. Every chip fills both boxes so what is about to be saved is
    // always the two numbers on screen.
    box.querySelectorAll('.hourchips button').forEach((button) => {
      button.onclick = () => setTimeTotal(Number(button.dataset.m));
    });
    // The steppers work on the pair as one duration, not on one box each, so
    // five more minutes at 55 reads 1h 00m rather than 60m — and five fewer
    // at 1h 00m goes back to 55m instead of stopping dead at zero minutes.
    box.querySelectorAll('.stepper button:not([data-qty])').forEach((button) => {
      button.onclick = () => setTimeTotal(timeTotal() + Number(button.dataset.by));
    });
    const digits = (event) => event.target.value.replace(/[^0-9]/g, '').slice(0, 4);
    $('hours').oninput = (event) => {
      draft('labor').hours = digits(event);
      event.target.value = draft('labor').hours;
      drawSaveButton();
    };
    // 90 in the minutes box is a real thing to type after a long stint, so it
    // is not clamped to 59 — it is carried into hours when the entry is saved.
    $('minutes').oninput = (event) => {
      draft('labor').minutes = digits(event);
      event.target.value = draft('labor').minutes;
      drawSaveButton();
    };
  } else if (state.tab === 'prop') {
    box.innerHTML = `
      ${state.props === null ? '<p class="loading">Checking what is already out…</p>' : ''}
      ${state.props && state.props.length ? `
        <label class="fld">Already out (${state.props.length})</label>
        <div class="proplist">${state.props.map((prop) => `
          <div class="proprow">
            ${prop.tagPhoto ? `<img src="${driveImageUrl(prop.tagPhoto.thumb)}" alt="Tag">`
              : `<div class="notag">no tag<br>photo</div>`}
            <div class="grow">
              <div class="who">${esc(prop.description || 'Prop')}</div>
              <div class="sub">${esc(prop.statusLabel)}${prop.vendor ? ` · ${esc(prop.vendor)}` : ''}</div>
            </div>
          </div>`).join('')}</div>` : ''}

      <label class="fld">The tag on this prop</label>
      <div class="row tight">
        <button class="btn ghost block" type="button" id="taketag">Photograph the tag</button>
        <button class="btn ghost block" type="button" id="picktag">Choose a photo</button>
      </div>
      <input id="tagcamera" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="taglibrary" type="file" accept="image/*" class="hidden">
      <div class="thumbrow" id="tagthumb"></div>
      <label class="fld" for="propdesc">Which prop</label>
      <input class="txt" id="propdesc" placeholder="Stainless 3-blade, port side" value="${esc(draft('prop').description)}">
      <p class="hint">That tag is how the prop shop knows whose it is, and how the office knows which
        boat it goes back on.</p>`;
    // The tag gets its own pair of doors for the same reason the log photos
    // do: the phone will not offer a choice on its own. One shot — a tag is
    // one tag.
    $('tagcamera').onchange = onTagPhoto;
    $('taglibrary').onchange = onTagPhoto;
    $('taketag').onclick = () => $('tagcamera').click();
    $('picktag').onclick = () => $('taglibrary').click();
    drawTagThumb();
    // Props are drawn nowhere else, so they are fetched nowhere else either —
    // opening a job does not pay for a list that four jobs in five is empty.
    if (state.props === null) loadProps();
  } else if (state.tab === 'part') {
    box.innerHTML = `
      <label class="fld" for="part">Part number / UPC</label>
      <div class="row tight" style="flex-wrap:nowrap">
        <input class="txt mono" id="part" placeholder="Scan or type" value="${esc(draft('part').part)}">
        <button class="btn ghost sm" type="button" id="scanpart">Scan</button>
      </div>
      <div id="partscanner"></div>
      ${qtyField('qty', 'Quantity used (optional)', draft('part').qty)}

      <label class="checkline">
        <input type="checkbox" id="needorder"${draft('part').needorder ? ' checked' : ''}>
        <span>Needs ordering for this job
          <small>Goes on the parts list for the service writer.</small></span>
      </label>
      <div id="orderqtybox"${draft('part').needorder ? '' : ' class="hidden"'}>
        ${qtyField('orderqty', 'How many to order', draft('part').orderqty)}
      </div>

      <label class="checkline">
        <input type="checkbox" id="needrestock"${draft('part').needrestock ? ' checked' : ''}>
        <span>Took from stock — needs restocking
          <small>Puts a replacement on the same list.</small></span>
      </label>
      <div id="restockqtybox"${draft('part').needrestock ? '' : ' class="hidden"'}>
        ${qtyField('restockqty', 'How many to restock', draft('part').restockqty)}
      </div>`;

    // The quantity is asked for the moment the box is ticked, because a part
    // on the list with no number against it is a phone call later.
    bindQtySteppers(box);
    [['needorder', 'orderqtybox', 'orderqty'], ['needrestock', 'restockqtybox', 'restockqty']]
      .forEach(([check, wrap, field]) => {
        $(check).onchange = () => {
          $(wrap).classList.toggle('hidden', !$(check).checked);
          if ($(check).checked) {
            if (!$(field).value) $(field).value = $('qty').value || '1';
            $(field).focus();
          }
        };
      });
    $('scanpart').onclick = () => {
      const holder = $('partscanner');
      if (state.scanning) { stopScanning(); holder.innerHTML = ''; return; }
      holder.innerHTML = `<div style="margin-top:10px">${scannerHtml('Line up the barcode on the box')}</div>`;
      startScanner(holder.querySelector('.scanner'), 'any', (value) => {
        $('part').value = value;
        holder.innerHTML = '';
      }).then((stop) => { state.scanning = stop; });
    };
  } else {
    box.innerHTML = '';
  }
}

/* ----------------------------------------------------------- recorder --- */

let recorder = null;
let recTimer = null;

function pickMime() {
  if (typeof MediaRecorder === 'undefined') return undefined;
  return ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
    .find((type) => MediaRecorder.isTypeSupported(type));
}

function drawRecorder(seconds) {
  const box = $('recorder');
  if (!box) return;
  const hint = state.tab === 'labor'
    ? 'Talk instead of typing and we will type it up — the hours still go in above. The recording is kept on the job.'
    : 'Speak it and we will type it up. The recording is kept on the job either way.';

  if (draft().audio) {
    box.innerHTML = `<audio controls src="${URL.createObjectURL(draft().audio)}" style="width:100%"></audio>
      <button class="btn ghost sm" type="button" id="discard" style="margin-top:8px">Discard recording</button>
      <p class="hint">${hint}</p>`;
    $('discard').onclick = () => { draft().audio = null; drawRecorder(); drawSaveButton(); };
    return;
  }
  const active = Boolean(recorder);
  box.innerHTML = `<button class="btn ${active ? 'danger' : 'ghost'} block" type="button" id="rec">
      ${active ? `Stop recording (${seconds || 0}s)` : (state.tab === 'labor' ? 'Say what you did' : 'Record a voice note')}
    </button><p class="hint">${hint}</p>`;
  $('rec').onclick = active ? stopRecording : startRecording;
}

async function startRecording() {
  if (typeof MediaRecorder === 'undefined') return toast('This browser cannot record audio. Type the note instead.');
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    return toast('Microphone access was blocked. Allow it for this site, or type the note instead.');
  }
  const mime = pickMime();
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    if (blob.size) draft().audio = blob;
    stream.getTracks().forEach((track) => track.stop());
    recorder = null;
    clearInterval(recTimer);
    drawRecorder();
  };
  recorder.start();
  let seconds = 0;
  drawRecorder(seconds);
  recTimer = setInterval(() => { seconds += 1; drawRecorder(seconds); }, 1000);
}

function stopRecording() {
  if (recorder) recorder.stop();
}

/* ------------------------------------------------------------- photos --- */

async function onPhotos(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  const d = draft();
  for (const file of files.slice(0, 8 - d.photos.length)) {
    try {
      d.photos.push(await preparePhoto(file));
    } catch {
      toast('Could not read one of those photos.');
    }
  }
  drawThumbs();
  drawSaveButton();
}

function drawThumbs() {
  const box = $('thumbs');
  if (!box) return;
  box.innerHTML = draft().photos.map((photo, index) => `<figure>
    <img src="data:image/jpeg;base64,${photo.thumb}" alt="">
    <button type="button" data-index="${index}" aria-label="Remove photo">✕</button>
  </figure>`).join('');
  box.querySelectorAll('button').forEach((button) => {
    button.onclick = () => {
      draft().photos.splice(Number(button.dataset.index), 1);
      drawThumbs();
      drawSaveButton();
    };
  });
}

/* --------------------------------------------------------- prop tags ---- */

async function onTagPhoto(event) {
  const file = (event.target.files || [])[0];
  event.target.value = '';
  if (!file) return;
  try {
    draft('prop').tagPhoto = await preparePhoto(file);
  } catch {
    toast('Could not read that photo.');
  }
  drawTagThumb();
}

function drawTagThumb() {
  const box = $('tagthumb');
  if (!box) return;
  box.innerHTML = draft('prop').tagPhoto ? `<figure>
    <img src="data:image/jpeg;base64,${draft('prop').tagPhoto.thumb}" alt="">
    <button type="button" data-cleartag aria-label="Remove the tag photo">&#10005;</button>
  </figure>` : '';
  const clear = box.querySelector('[data-cleartag]');
  if (clear) clear.onclick = () => { draft('prop').tagPhoto = null; drawTagThumb(); drawSaveButton(); };
}

/**
 * What is already away at the prop shop. Fetched when the tab opens rather
 * than when the job does, and a failure leaves an empty list rather than a
 * broken tab: the mechanic came here to send a prop out, and they still can.
 */
async function loadProps() {
  try {
    const data = await api('jobProps', [state.job.token]);
    state.props = data.props;
  } catch {
    state.props = [];
  }
  if (state.tab === 'prop') drawFields();
}

async function sendProp(tagPhoto, description) {
  try {
    const result = await api('addPropRepair', [state.job.token, { tagPhoto, description }]);
    state.props = result.props;
    if (state.tab === 'prop') drawFields();
    toast('On the list for pick-up.');
  } catch (error) {
    toast(error.message);
  }
}

/* -------------------------------------------------------------- save ---- */

/**
 * What the backend would refuse, said here instead — instantly.
 *
 * The rules are the backend's and it stays the authority; this is the same
 * short list said without a round trip, so a mechanic who forgot the part
 * number hears it now rather than two seconds later. It also keeps the
 * optimistic entry below honest: nothing goes into the feed that the shop
 * server was always going to reject.
 */
function whatIsMissing(payload) {
  const has = (value) => Boolean(String(value || '').trim());
  if (payload.entryType === 'labor') {
    if (!Number(payload.minutes)) return 'How long did this take?';
    if (!has(payload.text) && !payload.audio) return 'Say what you did with that time.';
    return null;
  }
  if (payload.entryType === 'part') {
    return has(payload.partIdentifier) ? null : 'Scan or type the part number.';
  }
  if (!has(payload.text) && !payload.audio && !(payload.photos || []).length) {
    return 'Add a note, a recording or a photo before saving.';
  }
  return null;
}

let pendingSeq = 0;

/**
 * The entry goes into the log the moment it is tapped, and the save happens
 * behind it.
 *
 * A round trip to Apps Script is a second or three on shop wifi, and a
 * mechanic holding a part in one hand and a phone in the other was made to
 * stand and watch it. Now the entry appears straight away marked "Saving…",
 * the form clears for the next one, and the row settles when the backend
 * answers. Nothing is silently assumed: an entry that fails says so in the
 * feed, in red, with a button to send it again, and it says it as a toast too
 * in case the mechanic has already walked to another screen.
 *
 * A save is never queued past the app being closed. That was a deliberate
 * line from the start — a note the phone swallowed is worse than one the
 * mechanic knows did not send.
 */
/** One draft, as the backend wants it. */
async function payloadFor(tab) {
  const d = draft(tab);
  const payload = { entryType: tab, text: d.text.trim() };

  // One figure goes over the wire. 1h 90m is 150 minutes, which is a
  // reasonable thing to have typed and not an error to hand back.
  if (tab === 'labor') payload.minutes = String((Number(d.hours) || 0) * 60 + (Number(d.minutes) || 0));
  if (tab === 'part') {
    payload.partIdentifier = d.part;
    payload.quantity = d.qty;
    if (d.needorder) payload.orderQty = d.orderqty || '1';
    if (d.needrestock) payload.restockQty = d.restockqty || '1';
  }
  if (d.audio) {
    payload.audio = await fileToBase64(d.audio);
    payload.audioMime = d.audio.type || 'audio/webm';
    payload.audioExt = payload.audioMime.includes('mp4') ? 'm4a' : payload.audioMime.includes('ogg') ? 'ogg' : 'webm';
  }
  payload.photos = d.photos;
  return payload;
}

/**
 * The one button saves every tab that has something in it.
 *
 * A mechanic finishing a job puts the hours in, scans the part they used and
 * writes what they found — in whatever order those things happened. Making
 * that three trips through the same button, with the fields wiped in between,
 * is how a note gets lost. Nothing is saved by surprise either: the tab strip
 * marks what is holding something, and the button says how many.
 *
 * A tab with SOME of an entry in it but not enough stops the save and says
 * which tab and what is missing. Silently skipping it would throw away
 * exactly the thing the mechanic thought they had written down.
 */
async function saveEntry() {
  captureDraft();
  const filled = filledTabs();
  if (!filled.length) {
    // Nothing anywhere. The most useful thing to say is what the tab they are
    // looking at would need.
    const missing = state.tab === 'prop'
      ? 'Photograph the tag, or say which prop this is.'
      : (whatIsMissing(await payloadFor(state.tab)) || 'Nothing to save yet.');
    $('notice').innerHTML = `<div class="banner warn" style="margin-bottom:12px">${esc(missing)}</div>`;
    return;
  }

  const payloads = {};
  const problems = [];
  for (const tab of filled) {
    if (tab === 'prop') continue;                 // its own rule, checked above
    payloads[tab] = await payloadFor(tab);
    const missing = whatIsMissing(payloads[tab]);
    if (missing) problems.push(`<b>${esc(TAB_LABEL[tab])}:</b> ${esc(missing)}`);
  }
  if (problems.length) {
    $('notice').innerHTML = `<div class="banner warn" style="margin-bottom:12px">${problems.join('<br>')}</div>`;
    return;
  }

  filled.forEach((tab) => {
    if (tab === 'prop') {
      const d = draft('prop');
      queueSend(() => sendProp(d.tagPhoto, d.description.trim()));
      return;
    }
    pendingSeq += 1;
    const payload = payloads[tab];
    const pending = {
      id: `pending-${pendingSeq}`,
      saveState: 'saving',
      payload: payload,
      entryType: tab,
      text: payload.text,
      hours: tab === 'labor' ? Number(payload.minutes) / 60 : null,
      partIdentifier: payload.partIdentifier || '',
      quantity: payload.quantity ? Number(payload.quantity) : null,
      mechanicName: state.who.name,
      createdAt: new Date().toISOString(),
      audioFile: '',
      transcriptStatus: '',
      photos: [],
      // Straight off the phone, so the shot appears in the feed before Drive
      // has heard of it.
      localPhotos: payload.photos || [],
    };
    // The feed is oldest first, so the new one goes on the end.
    state.entries = state.entries.concat([pending]);
    queueSend(() => sendEntry(pending));
  });

  clearDrafts();
  // A full redraw here is right: nothing is being typed at the instant the
  // save button is tapped, and the form has to come back empty for the next
  // entry. Everything after this touches only the feed.
  renderJob();
}

/**
 * Saves go out one after another rather than all at once.
 *
 * Every save in the shop queues on one script lock, so three at the same
 * instant would sit waiting on each other anyway — and the mechanic is not
 * waiting on any of them. One at a time also keeps the feed in the order the
 * tabs are in.
 */
let sendChain = Promise.resolve();
function queueSend(run) {
  sendChain = sendChain.then(run).catch(() => {});
}

async function sendEntry(pending) {
  try {
    const result = await api('addEntry', [state.job.token, pending.payload]);
    const index = state.entries.findIndex((entry) => entry.id === pending.id);
    // The save does not hand back the whole log — reading it cost a full scan
    // of every entry in the shop to return a list this page already has.
    if (index !== -1) state.entries[index] = result.entry;
    if (result.job) state.job = result.job;
    if (result.hours) state.hours = result.hours;
    // Only the feed and the running total, never the form: the mechanic may
    // be halfway through typing the next entry by now.
    drawFeed();
    drawHint();
    // The words land a moment after the entry does, and the mechanic is
    // still standing there — so watch for them rather than making them
    // reload to find out whether the recording came out.
    if (result.entry.transcriptStatus === 'pending') watchTranscript(result.entry.id);
  } catch (error) {
    pending.saveState = 'failed';
    pending.saveError = error.message;
    drawFeed();
    toast(error.message);
  }
}

function retryEntry(pending) {
  pending.saveState = 'saving';
  pending.saveError = '';
  drawFeed();
  sendEntry(pending);
}

/**
 * Polls for one voice note's transcript and drops it into the feed in place.
 *
 * Backed off rather than on a fixed tick: most come back in a few seconds,
 * and a phone on shop wifi should not hammer the backend for a minute over
 * one note. Gives up quietly after about ninety seconds and leaves the
 * "check again" button, because the hourly sweep is still behind this and
 * the words will arrive eventually either way.
 */
const TRANSCRIPT_WAITS = [2000, 2000, 3000, 3000, 4000, 5000, 6000, 8000, 10000, 12000, 15000, 20000];
let transcriptTimer = null;

function stopWatchingTranscript() {
  if (transcriptTimer) clearTimeout(transcriptTimer);
  transcriptTimer = null;
}

function watchTranscript(entryId, attempt = 0) {
  stopWatchingTranscript();
  if (attempt >= TRANSCRIPT_WAITS.length) return;

  transcriptTimer = setTimeout(async () => {
    let found = null;
    try {
      const data = await api('transcriptsFor', [state.job.token]);
      found = data.entries.find((e) => e.id === entryId) || null;
    } catch {
      // Offline for a moment, or the session lapsed. Try again; a failed
      // poll must never look like a failed recording.
      return watchTranscript(entryId, attempt + 1);
    }
    if (!found || found.transcriptStatus === 'pending') {
      return watchTranscript(entryId, attempt + 1);
    }

    const entry = state.entries.find((e) => e.id === entryId);
    if (entry) {
      // Both move: an entry logged before the transcript had its own column
      // keeps its words in `text`, and a typed note sits alongside the
      // spoken one rather than being replaced by it.
      entry.text = found.text;
      entry.transcript = found.transcript;
      entry.transcriptStatus = found.transcriptStatus;
      entry.transcriptError = found.transcriptError;
      drawFeed();
    }
    toast(found.transcriptStatus === 'done'
      ? 'Transcript is in — check it reads right.'
      : 'That recording could not be transcribed.');
  }, TRANSCRIPT_WAITS[attempt]);
}

function confirmFinish() {
  $('notice').innerHTML = `<div class="banner info" style="margin-bottom:12px">
    Mark ${esc(state.job.id)} finished? This tells the service writer the boat is physically done
    and ready to be written up in BiT.
    <div class="row" style="margin-top:12px">
      <button class="btn green" type="button" id="yes">Yes, work finished</button>
      <button class="btn ghost" type="button" id="no">Not yet</button>
    </div></div>`;
  $('no').onclick = () => { $('notice').innerHTML = ''; };
  $('yes').onclick = async () => {
    try {
      const result = await api('finishWork', [state.job.token]);
      state.job.status = result.status;
      state.job.statusLabel = result.statusLabel;
      renderJob();
      toast('Marked finished.');
    } catch (error) {
      $('notice').innerHTML = `<div class="banner warn">${esc(error.message)}</div>`;
    }
  };
}

/**
 * Nudge Apps Script awake before the mechanic needs it.
 *
 * Google boots a container to answer a request and keeps it warm briefly
 * afterwards, so the first call of the day pays for the start-up and the
 * ones behind it do not. This spends that cost while the app is opening and
 * while the camera is coming up — moments nobody is waiting through — so the
 * lookup that follows lands on a container already running.
 *
 * Fire and forget, at most once every half minute, and a failure is not worth
 * a word: whatever is wrong will say so properly on the call that matters.
 */
let lastWarm = 0;
function warm() {
  const now = Date.now();
  if (now - lastWarm < 30000) return;
  lastWarm = now;
  api('ping', []).catch(() => {});
}

warm();
renderHome();
</script>
</body>
</html>
