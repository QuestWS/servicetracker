/* ------------------------------------------------------------ archive --- */

/**
 * Filed-away parts orders, as a flat table rather than grouped orders.
 *
 * This page exists to be searched, and the questions it answers are about one
 * line — "who did we get that impeller from", "what went on the Purnell job".
 * Grouping by order would bury exactly the field being looked for.
 *
 * The searching and sorting happen here in the browser off one fetch. Apps
 * Script charges per round trip; a query per keystroke would be unusable, and
 * the backend has to read the whole tab to answer at all.
 */
const ARCHIVE_COLUMNS = [
  ['part', 'Part', (p) => p.partIdentifier || p.description || ''],
  ['customerName', 'Customer', (p) => p.customerName || ''],
  ['vendor', 'Supplier', (p) => p.vendor || ''],
  ['jobId', 'Work order', (p) => p.jobId || ''],
  ['orderNumber', 'Order no.', (p) => p.orderNumber || ''],
  ['archivedAt', 'Filed', (p) => p.archivedAt || ''],
];

async function renderArchive() {
  view.className = 'wrap';
  view.innerHTML = `<p class="loading">Loading the archive…</p>`;
  const { parts } = await api('listArchivedParts', []);

  // Newest first is the useful default: the thing filed last week is the
  // thing most likely being looked for.
  let sortKey = 'archivedAt';
  let ascending = false;
  let search = '';

  const value = (part, key) => {
    const column = ARCHIVE_COLUMNS.find((c) => c[0] === key);
    return column ? column[2](part) : '';
  };

  const shown = () => {
    const needle = search.trim().toLowerCase();
    const matched = !needle ? parts.slice() : parts.filter((part) =>
      ARCHIVE_COLUMNS.some((column) => column[2](part).toLowerCase().includes(needle))
      || String(part.description || '').toLowerCase().includes(needle));
    return matched.sort((a, b) => {
      const left = value(a, sortKey);
      const right = value(b, sortKey);
      // Blanks last whichever way the column is pointing — an empty supplier
      // is not the "smallest" supplier, it is a row with nothing to say.
      if (!left && right) return 1;
      if (left && !right) return -1;
      return (ascending ? 1 : -1) * String(left).localeCompare(String(right), undefined, { numeric: true });
    });
  };

  const draw = () => {
    const rows = shown();
    $('archivebody').innerHTML = rows.length ? rows.map((part) => `
      <tr>
        <td>
          <b style="font-family:var(--mono)">${esc(part.partIdentifier || '(no part number)')}</b>
          ${part.quantity ? `<span class="sub"> &times;${part.quantity}</span>` : ''}
          ${part.description ? `<div class="sub">${esc(part.description)}</div>` : ''}
        </td>
        <td>${esc(part.customerName || '—')}</td>
        <td>${esc(part.vendor || '—')}</td>
        <td>${part.jobId ? `<a href="?job=${encodeURIComponent(part.jobId)}">${esc(part.jobId)}</a>` : '<span class="sub">stock</span>'}</td>
        <td class="mono">${esc(part.orderNumber || '—')}</td>
        <td class="sub">${formatDate(part.archivedAt)}</td>
        <td class="row tight" style="justify-content:flex-end">
          <button class="btn ghost sm" type="button" data-unarchive="${esc(part.id)}">Restore</button>
          <button class="btn danger sm" type="button" data-archdelete="${esc(part.id)}"
            data-what="${esc(part.partIdentifier || part.description || 'this part')}">Delete</button>
        </td>
      </tr>`).join('')
      : `<tr><td colspan="7"><div class="empty" style="margin:0">${
          search ? 'Nothing archived matches that.' : 'Nothing filed away yet.'}</div></td></tr>`;

    $('archivecount').textContent = search
      ? `${rows.length} of ${parts.length}`
      : `${parts.length}`;

    view.querySelectorAll('[data-sort]').forEach((th) => {
      const on = th.dataset.sort === sortKey;
      th.classList.toggle('on', on);
      th.querySelector('span').textContent = on ? (ascending ? ' ▲' : ' ▼') : '';
    });
    wire();
  };

  const fail = (error) => {
    $('notice').innerHTML = `<div class="banner warn">${esc(error.message)}</div>`;
  };

  // Rows are redrawn on every keystroke, so their buttons are rebound here
  // rather than once at the top.
  const wire = () => {
    view.querySelectorAll('[data-unarchive]').forEach((button) => {
      button.onclick = async () => {
        try {
          await api('archiveParts', [[button.dataset.unarchive], false]);
          renderArchive();
          toast('Back on the parts list.');
        } catch (error) { fail(error); }
      };
    });
    view.querySelectorAll('[data-archdelete]').forEach((button) => {
      button.onclick = async () => {
        if (!confirm(`Delete ${button.dataset.what}? This cannot be undone.`)) return;
        try {
          await api('deleteParts', [[button.dataset.archdelete]]);
          renderArchive();
          toast('Deleted.');
        } catch (error) { fail(error); }
      };
    });
  };

  view.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h1 class="page-title" style="margin:0">Archived orders</h1>
      <a class="btn ghost" href="?view=parts">Back to parts</a>
    </div>
    <p class="lead">Completed orders that have been filed away — kept whole and searchable, and off
      the working parts list. <b id="archivecount">0</b> filed.</p>
    <div id="notice"></div>

    <form class="row" id="archiveform" style="margin:14px 0">
      <input class="txt" id="archiveq" style="flex:1 1 260px"
        placeholder="Search part, customer, supplier or work order" autocomplete="off">
    </form>

    <div class="tablewrap">
      <table class="grid">
        <thead><tr>
          ${ARCHIVE_COLUMNS.map(([key, label]) =>
            `<th data-sort="${key}"><button type="button">${label}<span></span></button></th>`).join('')}
          <th></th>
        </tr></thead>
        <tbody id="archivebody"></tbody>
      </table>
    </div>`;

  $('archiveform').onsubmit = (event) => event.preventDefault();
  $('archiveq').oninput = (event) => { search = event.target.value; draw(); };
  view.querySelectorAll('[data-sort]').forEach((th) => {
    th.querySelector('button').onclick = () => {
      const key = th.dataset.sort;
      // Same column again flips the direction; a new one starts A→Z, except
      // the date, where the useful first answer is the most recent.
      if (key === sortKey) ascending = !ascending;
      else { sortKey = key; ascending = key !== 'archivedAt'; }
      draw();
    };
  });
  draw();
}

/* -------------------------------------------------------------- props --- */

/**
 * One prop on the list. The tag photo leads, because a prop has no number to
 * read instead — the tag wired to it is the whole of its identity, and the
 * writer matching a returned prop to a boat is reading that photo.
 */
function propLine(prop, options) {
  const tail = [];
  if (prop.jobId) tail.push(`<a href="?job=${encodeURIComponent(prop.jobId)}">job ${esc(prop.jobId)}</a>`);
  if (prop.customerName) tail.push(esc(prop.customerName));
  if (prop.boatInfo) tail.push(esc(prop.boatInfo));
  if (prop.requestedBy) tail.push(`pulled by ${esc(prop.requestedBy)}`);
  tail.push(formatDate(prop.createdAt));

  const pill = { ready: 'blue', picked_up: 'gold', fixed: 'green', unfixable: 'red' }[prop.status];

  return `<div class="partrow proprow-admin" data-prop="${esc(prop.id)}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
      ${prop.tagPhoto
        ? `<a href="${driveFileUrl(prop.tagPhoto.full)}" target="_blank" rel="noopener" class="tagshot">
             <img src="${driveImageUrl(prop.tagPhoto.thumb)}" alt="Tag"></a>`
        : `<div class="tagshot notag">no tag photo</div>`}
      <div style="flex:1;min-width:0">
        <div>${options.select ? `<input type="checkbox" class="proppick" value="${esc(prop.id)}">` : ''}
          <b>${esc(prop.description || 'Prop')}</b>
          <span class="pill ${pill}">${esc(prop.statusLabel)}</span>
        </div>
        <div class="sub">${tail.join(' · ')}</div>
        ${prop.vendor ? `<div class="sub">${esc(prop.vendor)}${prop.pickedUpAt ? ` · picked up ${formatDate(prop.pickedUpAt)}` : ''}${prop.returnedAt ? ` · back ${formatDate(prop.returnedAt)}` : ''}</div>` : ''}
      </div>
      <div class="row tight" style="justify-content:flex-end">
        ${options.returnable ? `
          <button class="btn ghost sm" type="button" data-fixed="${esc(prop.id)}">Back, fixed</button>
          <button class="btn danger sm" type="button" data-unfixable="${esc(prop.id)}">Unfixable</button>` : ''}
        ${options.cancel ? `<button class="btn ghost sm" type="button" data-propcancel="${esc(prop.id)}">Remove</button>` : ''}
      </div>
    </div>
    <div class="row tight" style="flex-wrap:nowrap;margin-top:6px">
      <input class="txt" data-propnote="${esc(prop.id)}" value="${esc(prop.notes)}"
        placeholder="Note — quoted at, owner called, back Friday…" aria-label="Note">
      <button class="btn ghost sm" type="button" data-savepropnote="${esc(prop.id)}">Save</button>
    </div>
  </div>`;
}

async function renderProps() {
  view.className = 'wrap';
  view.innerHTML = `<p class="loading">Loading the props…</p>`;
  const { ready, pickedUp, back } = await api('listProps', []);

  view.innerHTML = `
    <h1 class="page-title">Props</h1>
    <p class="lead">
      Propellers off customers' boats and away at the prop shop. A mechanic pulls one, photographs
      the tag wired to it, and it lands here — the tag photo is what tells you whose it is when it
      comes back. None of this reaches the customer.
    </p>
    <div id="notice"></div>

    <section class="card" style="margin-top:16px">
      <h2>Ready for pick-up (${ready.length})</h2>
      ${ready.length ? `
        <div class="partlist">${ready.map((p) => propLine(p, { select: true, cancel: true })).join('')}</div>
        <div class="card flat" style="margin-top:14px;background:#f4f9fc">
          <label class="fld" for="propvendor">Picked up by</label>
          <input class="txt" id="propvendor" placeholder="Which prop shop">
          <button class="btn navy" type="button" id="markpicked" style="margin-top:12px">
            Mark the ticked props picked up
          </button>
        </div>`
        : `<div class="empty">Nothing waiting on the bench.</div>`}
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Out for repair (${pickedUp.length})</h2>
      ${pickedUp.length
        ? `<div class="partlist">${pickedUp.map((p) => propLine(p, { returnable: true })).join('')}</div>`
        : `<div class="empty">Nothing out at the moment.</div>`}
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Back (${back.length})</h2>
      ${back.length
        ? `<div class="partlist">${back.map((p) => propLine(p, {})).join('')}</div>`
        : `<div class="empty">Nothing has come back yet.</div>`}
    </section>`;

  const fail = (error) => {
    $('notice').innerHTML = `<div class="banner warn">${esc(error.message)}</div>`;
  };

  const markpicked = $('markpicked');
  if (markpicked) markpicked.onclick = async () => {
    const ids = Array.from(view.querySelectorAll('.proppick:checked')).map((box) => box.value);
    if (!ids.length) return fail(new Error('Tick the props that went.'));
    try {
      await api('markPropsPickedUp', [ids, $('propvendor').value]);
      renderProps();
      toast('Marked picked up.');
    } catch (error) { fail(error); }
  };

  const returned = (attribute, outcome, said) => {
    view.querySelectorAll(`[data-${attribute}]`).forEach((button) => {
      button.onclick = () => api('markPropReturned', [button.dataset[attribute], outcome])
        .then(() => { renderProps(); toast(said); }).catch(fail);
    });
  };
  returned('fixed', 'fixed', 'Back on the bench.');
  returned('unfixable', 'unfixable', 'Marked unfixable — the owner will need a new one.');

  view.querySelectorAll('[data-propcancel]').forEach((button) => {
    button.onclick = () => api('cancelProp', [button.dataset.propcancel])
      .then(renderProps).catch(fail);
  });
  view.querySelectorAll('[data-savepropnote]').forEach((button) => {
    button.onclick = () => {
      const field = view.querySelector(`[data-propnote="${button.dataset.savepropnote}"]`);
      api('setPropNote', [button.dataset.savepropnote, field.value])
        .then(() => toast('Note saved.')).catch(fail);
    };
  });
}

/* -------------------------------------------------------------- setup --- */

async function renderSetup() {
  view.className = 'wrap narrow';
  const appUrl = `${SITE_URL}/m/`;
  const settings = await api('config', []);
  showTestBanner(settings.testMode);
  // Asked for separately so a failure here cannot take the whole page down —
  // the sheet being behind is exactly when you most need this page to load.
  let sheet = null;
  try { sheet = await api('sheetStatus', []); } catch { sheet = null; }
  view.innerHTML = `
    ${sheet ? `<div class="banner ${sheet.ready ? 'ok' : 'warn'}" style="margin-bottom:16px" id="sheetbanner">
        ${sheet.ready
          ? `<b>The sheet is up to date.</b>
             Every tab and column the current code expects is there, and every job's totals agree
             with the log.`
          : `<b>The sheet is behind the code.</b>
             <div style="margin-top:6px">A deploy has added something the workbook does not have
               yet. Bringing it up to date only ever adds what is missing — nothing already there
               is touched.</div>
             ${sheet.missing.length ? `<ul style="margin:8px 0 0 18px">${sheet.missing.map((gap) =>
               `<li>${gap.absent
                 ? `The <b>${esc(gap.tab)}</b> tab does not exist yet`
                 : `<b>${esc(gap.tab)}</b> is missing: ${gap.columns.map((c) => `<code>${esc(c)}</code>`).join(', ')}`}</li>`).join('')}</ul>` : ''}
             ${sheet.drifted ? `<div style="margin-top:8px">${sheet.drifted} job${sheet.drifted === 1 ? '' : 's'}
               have entry or time totals that disagree with the log${sheet.driftedIds.length
                 ? ` (${sheet.driftedIds.map((id) => esc(id)).join(', ')}${sheet.drifted > sheet.driftedIds.length ? ', …' : ''})` : ''}.
               This recounts them.</div>` : ''}`}
        <div style="margin-top:12px">
          <button class="btn ${sheet.ready ? 'ghost' : 'navy'} sm" type="button" id="runsetup">${
            sheet.ready ? 'Run it again anyway' : 'Bring the sheet up to date'}</button>
        </div>
        <div id="setupout"></div>
      </div>` : ''}

    <h1 class="page-title">Put the app on a phone</h1>
    <p class="lead">
      Do this once per phone or iPad. After it is on the home screen, the daily routine is: tap the
      icon, scan the work order, tap your name.
    </p>

    <section class="card">
      <h2>Step 1 — open this on the phone</h2>
      <div style="text-align:center;padding:10px 0 16px">
        <div style="display:inline-block;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff">
          ${qrSvg(appUrl, 220)}
        </div>
      </div>
      <p class="hint" style="text-align:center;margin-bottom:14px">
        Point the phone's normal camera at this code — no app needed yet.
      </p>
      <label class="fld">Or type this address</label>
      <div class="row tight" style="flex-wrap:nowrap">
        <input class="txt mono" readonly value="${esc(appUrl)}" id="appurl">
        <button class="btn ghost sm" type="button" id="copyurl">Copy</button>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Step 2 — add it to the home screen</h2>
      <div class="grid2">
        <div>
          <b style="color:var(--navy)">iPhone / iPad (Safari)</b>
          <ol style="margin:8px 0 0 18px;padding:0;font-size:14.5px;line-height:1.6">
            <li>Tap the Share button (the square with the arrow).</li>
            <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
            <li>Tap <b>Add</b>. The Quest icon appears with the other apps.</li>
          </ol>
          <p class="hint">It must be Safari — the Share sheet in Chrome on iOS does not offer this.</p>
        </div>
        <div>
          <b style="color:var(--navy)">Android (Chrome)</b>
          <ol style="margin:8px 0 0 18px;padding:0;font-size:14.5px;line-height:1.6">
            <li>Tap the ⋮ menu, top right.</li>
            <li>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</li>
            <li>Confirm. The Quest icon appears in the app drawer.</li>
          </ol>
          <p class="hint">Chrome often offers this by itself as a bar at the bottom.</p>
        </div>
      </div>
    </section>

    <section class="card ${settings.testMode ? 'gold' : ''}" style="margin-top:16px">
      <h2 ${settings.testMode ? 'style="color:#8a6516"' : ''}>Test mode</h2>
      ${settings.testMode ? `
        <p style="font-size:15px;line-height:1.55;margin-bottom:12px">
          <b>On.</b> Run as many real work orders through as you like. Scanning, logging, hours,
          photos and the invoice all behave exactly as they will in production — the one
          difference is that the customer's finished-job email goes to
          <b>${esc(settings.testEmail)}</b> instead of to them.
        </p>
        <p class="hint" style="margin-bottom:14px">
          Turn this off when you are happy. From that moment, pressing <b>Email the invoice</b> on a
          finished job reaches the customer for real. Nothing sends by itself either way.
        </p>
        <button class="btn gold block" type="button" id="golive">Go live — let the invoice email reach customers</button>
      ` : `
        <p style="font-size:15px;line-height:1.55;margin-bottom:12px">
          <b>Off — this deployment is live.</b> The invoice email you send from a finished job
          goes to the customer.
        </p>
        <button class="btn ghost block" type="button" id="gotest">Go back to test mode</button>
      `}
    </section>

    <section class="card" style="margin-top:16px" id="speedcard">
      <h2>How fast the backend is answering</h2>
      <p style="font-size:15px;line-height:1.55">
        Every call this browser has made, most recent first. <b>Round trip</b> is the wait somebody
        actually sits through. <b>In the sheet</b> is the part Apps Script spent doing the work —
        the rest is Google starting the script up and the shop's wifi, which is why a small job and
        a big one take about the same time.
      </p>
      <div id="speedlist" style="margin-top:12px"></div>
      <button class="btn ghost sm" type="button" id="timeagain" style="margin-top:12px">Time it again</button>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>Step 3 — check the camera works</h2>
      <p style="font-size:15px;line-height:1.55">
        Open the app from the home screen and tap <b>Scan work order</b>. The phone asks for camera
        permission the first time — say yes. If someone taps &ldquo;don't allow&rdquo; by mistake,
        the app still works: the <b>Type invoice number instead</b> button is right on the same
        screen, and camera permission can be re-enabled in the phone's settings for this site.
      </p>
    </section>`;
  $('copyurl').onclick = async () => {
    try { await navigator.clipboard.writeText(appUrl); toast('Address copied.'); }
    catch { $('appurl').select(); }
  };

  /**
   * setup(), without opening Apps Script.
   *
   * Every deploy that adds a column or a trigger needs it run once, and doing
   * that in the editor means finding a function in a dropdown on a page
   * nobody in the shop otherwise visits.
   */
  const runsetup = $('runsetup');
  if (runsetup) runsetup.onclick = async () => {
    runsetup.disabled = true;
    runsetup.textContent = 'Bringing it up to date…';
    try {
      const result = await api('runSetup', []);
      if (result.ok) {
        toast('The sheet is up to date.');
        return renderSetup();
      }
      // Part way. The columns are written before the triggers are installed,
      // so say which half landed rather than implying none of it did.
      $('setupout').innerHTML = `<div style="margin-top:10px">
        <b>Partly done.</b> ${esc(result.error)}
        <div style="margin-top:6px">${result.status && result.status.ready
          ? 'The tabs and columns are in place. What is left needs running once from the Apps Script editor.'
          : 'Nothing was changed. Try again, or run setup() from the Apps Script editor.'}</div></div>`;
      runsetup.disabled = false;
      runsetup.textContent = 'Try again';
    } catch (error) {
      $('setupout').innerHTML = `<div style="margin-top:10px">${esc(error.message)}</div>`;
      runsetup.disabled = false;
      runsetup.textContent = 'Try again';
    }
  };

  const drawSpeed = () => {
    const box = $('speedlist');
    if (!box) return;
    const recent = timings.slice().reverse();
    box.innerHTML = recent.length ? recent.map((call) => `
      <div class="kv">
        <span class="k" style="font-family:var(--mono)">${esc(call.fn)}</span>
        <b>${(call.ms / 1000).toFixed(1)}s${call.serverMs === null ? ''
          : ` <span class="sub">· ${(call.serverMs / 1000).toFixed(1)}s in the sheet</span>`}</b>
      </div>`).join('') : '<p class="hint">Nothing timed yet.</p>';
  };
  drawSpeed();

  $('timeagain').onclick = async () => {
    const button = $('timeagain');
    button.disabled = true;
    button.textContent = 'Timing…';
    try { await api('listJobs', [{ status: 'open' }]); } catch { /* the timing is the point */ }
    try { await api('sheetStatus', []); } catch { /* same */ }
    drawSpeed();
    button.disabled = false;
    button.textContent = 'Time it again';
  };

  const golive = $('golive');
  if (golive) golive.onclick = async () => {
    if (!confirm('Go live? From now on, the invoice email you send from a finished job reaches the customer.')) return;
    await api('setTestMode', [false]);
    renderSetup();
    toast('Live. The invoice email now reaches customers when you send it.');
  };

  const gotest = $('gotest');
  if (gotest) gotest.onclick = async () => {
    await api('setTestMode', [true]);
    renderSetup();
    toast('Back in test mode. Nothing reaches customers.');
  };
}

/* -------------------------------------------------------------- route --- */

async function route() {
  if (!storedToken()) return renderSignIn();
  $('topbar').hidden = false;
  view.className = 'wrap';

  const which = params.get('view');
  const job = params.get('job');
  document.querySelectorAll('[data-nav]').forEach((link) => {
    link.classList.toggle('on', link.dataset.nav === (which || 'jobs'));
  });

  try {
    if (job) return await renderJob(job);
    if (which === 'intake') return renderIntake();
    if (which === 'parts') return await renderParts();
    if (which === 'props') return await renderProps();
    if (which === 'archive') return await renderArchive();
    if (which === 'mechanics') return await renderMechanics();
    if (which === 'setup') return await renderSetup();
    if (params.get('setup')) return await renderSetup();
    return await renderJobs();
  } catch (error) {
    if (/Sign in/.test(error.message)) return renderSignIn();
    view.innerHTML = `<div class="banner warn">${esc(error.message)}</div>`;
  }
}

$('signout').onclick = () => { clearSession(); location.search = ''; };

// A sign-in link is spent before anything else looks at the session.
const magic = params.get('k');
if (magic) {
  consumeMagicLink(magic).then((failure) => (failure ? renderSignIn(failure) : route()));
} else {
  route();
}
</script>
