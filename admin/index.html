<!-- Loaded without blocking the page. A stylesheet from another origin holds
     up first paint until it answers, and when Google cannot be reached it does
     not fail fast — it sits for about twelve seconds and then resets. On shop
     wifi that is twelve seconds of a mechanic looking at "Starting up…". The
     media/onload swap lets the page paint immediately in the fallback stack
     and take the webfont whenever it turns up. -->

import { api, storeSession, storedToken, clearSession, timings } from '../assets/lib/api.js';
import { byLastName } from '../assets/lib/names.js';
import { SITE_URL } from '../assets/lib/config.js';

import { extractPdf } from '../assets/lib/extract.js';

const view = $('view');
const params = new URLSearchParams(location.search);
let intake = null;
let testMode = null;

/**
 * Test mode is loud on purpose. It is the default on a fresh deployment, so
 * the failure it has to prevent is somebody forgetting it is on and wondering
 * for a fortnight why no customer has been emailed.
 */
function showTestBanner(on) {
  testMode = on;
  const banner = $('testbanner');
  banner.hidden = !on;
  if (!on) {
    // Emptied, not just hidden: a banner that is still in the page is a
    // banner somebody's screen reader still reads out.
    banner.innerHTML = '';
    return;
  }
  banner.innerHTML = `<div class="wrap" style="padding-top:14px;padding-bottom:0">
    <div class="banner warn">
      <b>Test mode.</b> The invoice email goes to the shop instead of the customer.
      Everything else — scanning, logging, hours, the invoice — works for real.
      <a href="?view=setup" style="margin-left:6px">Go live when you are ready →</a>
    </div>
  </div>`;
}

const go = (query) => { location.search = query; };

/* ------------------------------------------------------------- sign in --- */

function renderSignIn(error, note) {
  $('topbar').hidden = true;
  view.className = 'wrap narrow';
  view.innerHTML = `
    <div class="card" style="max-width:420px;margin:40px auto">
      <h2>Sign in</h2>
      ${error ? `<div class="banner warn">${esc(error)}</div>` : ''}
      ${note ? `<div class="banner ok">${esc(note)}</div>` : ''}
      <form id="form">
        <label class="fld" for="password">Portal password</label>
        <input class="txt" id="password" type="password" autocomplete="current-password" autofocus required>
        <button class="btn navy block" type="submit" style="margin-top:16px">Sign in</button>
      </form>

      <div class="row" style="align-items:center;gap:10px;margin:18px 0 14px">
        <hr style="flex:1;border:0;border-top:1px solid var(--ice)">
        <span class="hint" style="margin:0">or</span>
        <hr style="flex:1;border:0;border-top:1px solid var(--ice)">
      </div>
      <button class="btn ghost block" type="button" id="maillink">Email me a sign-in link</button>
      <p class="hint" style="margin-top:8px">
        Goes to the service desk inbox. Good for one sign-in, and only for a few minutes.
      </p>

      <p class="hint" style="margin-top:14px">
        Mechanics do not sign in here — they open the app on their phone and tap their name.
      </p>
    </div>`;
  $('form').onsubmit = async (event) => {
    event.preventDefault();
    try {
      const result = await api('adminSignIn', [$('password').value]);
      storeSession(result.token, { role: 'admin' }, true);
      route();
    } catch (err) {
      renderSignIn(err.message);
    }
  };
  $('maillink').onclick = async () => {
    const button = $('maillink');
    button.disabled = true;
    button.textContent = 'Sending…';
    try {
      const result = await api('requestMagicLink', []);
      renderSignIn('', `Sent to ${result.sentTo}. The link works once, for ${result.minutes} minutes.`);
    } catch (err) {
      button.disabled = false;
      button.textContent = 'Email me a sign-in link';
      renderSignIn(err.message);
    }
  };
}

/**
 * A mailed link arrives as /admin/?k=NONCE. Spend it, then put the address
 * back to a clean /admin/ so the nonce is not left in history, in the title
 * bar, or in whatever the next link the writer copies out of it.
 */
async function consumeMagicLink(nonce) {
  try {
    const result = await api('magicSignIn', [nonce]);
    storeSession(result.token, { role: 'admin' }, true);
    history.replaceState(null, '', location.pathname);
    return null;
  } catch (err) {
    history.replaceState(null, '', location.pathname);
    // A stale link clicked by somebody who is already signed in should not
    // look like being thrown out. Only report it if there is no session.
    return storedToken() ? null : err.message;
  }
}

/* --------------------------------------------------------------- jobs --- */

// Open first, because that is the working list. "All" sits at the far end
// next to Done — the two you go looking for rather than land on.
const JOB_FILTERS = ['open', 'received', 'work_underway', 'work_finished', 'all', 'done'];
const JOB_FILTER_LABEL = Object.assign({ open: 'Open jobs', all: 'All' }, STATUS_LABEL);

/**
 * The three ways the writer looks for a job.
 *
 * Newest first is the working list. The other two are for going FOR something
 * — a number off a piece of paper, or a customer on the phone — so the number
 * runs upwards and the names run A to Z, which is the order you scan in.
 *
 * Sorted in the browser off the one fetch, like the parts archive: Apps
 * Script charges per round trip, and re-asking the backend to put the same
 * rows in a different order would be a wait for nothing.
 */
const JOB_SORTS = {
  newest: 'Newest first',
  number: 'Work order number',
  customer: 'Customer last name',
};

function sortJobs(jobs, sort) {
  const rows = jobs.slice();
  if (sort === 'number') {
    // Numeric compare, so 01-889 comes before 01-8891 rather than after it.
    return rows.sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  }
  if (sort === 'customer') {
    return rows.sort((a, b) => byLastName(a.customerName, b.customerName)
      || String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  }
  return rows;                                  // as the backend sent it
}

async function renderJobs() {
  // Open is the default, so it is the one that carries no parameter.
  const status = params.get('status') || 'open';
  const search = params.get('q') || '';
  const sort = JOB_SORTS[params.get('sort')] ? params.get('sort') : 'newest';
  view.innerHTML = `<p class="loading">Loading jobs…</p>`;
  const { jobs: fetched, counts, testMode: mode } = await api('listJobs', [{ status, search }]);
  showTestBanner(mode);
  const jobs = sortJobs(fetched, sort);

  const href = (value) => {
    const next = new URLSearchParams();
    if (value !== 'open') next.set('status', value);
    if (search) next.set('q', search);
    // The order carries across the chips: picking a different stage should
    // not quietly put the list back into date order.
    if (sort !== 'newest') next.set('sort', sort);
    const query = next.toString();
    return query ? `?${query}` : '?';
  };

  view.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <h1 class="page-title">Jobs</h1>
      <a class="btn navy" href="?view=intake">New work order</a>
    </div>

    <div class="stats" style="margin-bottom:16px">
      ${STATUSES.map((value) => `<a class="stat" href="${href(value)}">
        <div class="v">${counts[value] || 0}</div><div class="k">${STATUS_LABEL[value]}</div></a>`).join('')}
    </div>

    <form class="row" id="searchform" style="margin-bottom:14px">
      <input class="txt" id="q" placeholder="Invoice #, customer or boat" value="${esc(search)}" style="flex:1 1 240px">
      <button class="btn ghost" type="submit">Search</button>
      ${search || status !== 'open' ? `<a class="btn ghost" href="?">Clear</a>` : ''}
    </form>

    <div class="row filterbar" style="margin-bottom:14px">
      <div class="row tight" style="flex:1 1 auto">
        ${JOB_FILTERS.map((value) => `<a class="chip${status === value ? ' on' : ''}" href="${href(value)}">${
          JOB_FILTER_LABEL[value]}${value === 'open' ? ` (${counts.open || 0})` : ''}</a>`).join('')}
      </div>
      <label class="sortby" for="sortby">Sort
        <select id="sortby">
          ${Object.keys(JOB_SORTS).map((value) => `<option value="${value}"${
            sort === value ? ' selected' : ''}>${JOB_SORTS[value]}</option>`).join('')}
        </select>
      </label>
    </div>

    ${jobs.length ? `<div class="joblist">${jobs.map((job) => `
      <a class="jobrow" href="?job=${encodeURIComponent(job.id)}">
        <div style="min-width:84px">
          <div class="num">${esc(job.id)}</div>
          <div class="sub">${formatDate(job.createdAt)}</div>
        </div>
        <div class="grow">
          <div class="who">${esc(job.customerName || '(no name on file)')}</div>
          <div class="sub">${esc(job.boatInfo || '(no boat details)')}</div>
        </div>
        <div class="row tight jobmeta">
          ${job.needsReview.length ? `<span class="pill red">${job.needsReview.length} to fill in</span>` : ''}
          ${job.hours ? `<span class="pill frost">${formatHours(job.hours)}</span>` : ''}
          <span class="pill grey">${job.entryCount} log</span>
          <span class="pill ${STATUS_PILL[job.status]}">${STATUS_LABEL[job.status]}</span>
          <span class="sub" style="min-width:78px;text-align:right">${relativeDays(job.updatedAt)}</span>
        </div>
      </a>`).join('')}</div>`
    : `<div class="empty">${
        search ? 'No jobs match that search.'
        : status === 'open' ? 'Nothing open. Every job is done and paid.'
        : status !== 'all' ? 'No jobs at that stage.'
        : 'No jobs yet. Upload a BiT work order to create the first one.'}</div>`}`;

  $('searchform').onsubmit = (event) => {
    event.preventDefault();
    const next = new URLSearchParams();
    if (status !== 'all') next.set('status', status);
    if ($('q').value.trim()) next.set('q', $('q').value.trim());
    if (sort !== 'newest') next.set('sort', sort);
    go(next.toString());
  };

  // In the address, so it survives a refresh and the browser's Back button
  // walks the list the way the writer walked it.
  $('sortby').onchange = (event) => {
    const next = new URLSearchParams();
    if (status !== 'open') next.set('status', status);
    if (search) next.set('q', search);
    if (event.target.value !== 'newest') next.set('sort', event.target.value);
    go(next.toString());
  };
}

/* ---------------------------------------------------------- job detail --- */

function entryHtml(entry) {
  const pill = { customer_note: 'green', internal_note: 'blue', writer_note: 'gold', labor: 'frost', part: 'gold' }[entry.entryType];
  let body = '';
  // Typed and spoken are two different things a mechanic said, and an entry
  // can carry both. The transcript is labelled because it is a machine's
  // guess at what was said and the writer is meant to read it as one.
  if (entry.text) body = `<div class="body">${esc(entry.text)}</div>`;
  if (entry.transcript) body += `<div class="body said"><span class="saidtag">Said</span>${esc(entry.transcript)}</div>`;
  else if (entry.transcriptStatus === 'pending') body += `<div class="body pending">Voice note — transcribing…</div>`;
  else if (entry.transcriptStatus === 'failed') body += `<div class="body pending">Voice note — transcription failed${entry.transcriptError ? ` (${esc(entry.transcriptError)})` : ''}. The recording is below.</div>`;
  return `<article class="entry ${entry.entryType}">
    <div class="meta">
      <span class="pill ${pill}">${esc(ENTRY_LABEL[entry.entryType])}</span>
      <span>${esc(entry.mechanicName || 'Unknown')}</span><span>·</span>
      <time>${formatDateTime(entry.createdAt)}</time>
    </div>
    ${entry.entryType === 'part' ? `<div class="partline">${esc(entry.partIdentifier || '(no identifier)')}${entry.quantity ? ` × ${entry.quantity}` : ''}</div>` : ''}
    ${entry.entryType === 'labor' && entry.hours !== null ? `<div class="hoursline">${formatHours(entry.hours)}</div>` : ''}
    ${body}
    ${entry.audioFile ? `<div class="audiorow">
      <a href="${driveFileUrl(entry.audioFile)}" target="_blank" rel="noreferrer">Open the recording in Drive</a>
    </div>` : ''}
    ${entry.photos.length ? `<div class="photos">${entry.photos.map((p) => `
      <a href="${driveImageUrl(p.full, 1600)}" target="_blank" rel="noreferrer">
        <img src="${driveImageUrl(p.thumb, 400)}" alt="Job photo" loading="lazy"></a>`).join('')}</div>` : ''}
    <!-- Quiet on purpose. This log is read many times a day and corrected
         rarely, so the two controls that change it sit small and last. -->
    <div class="entryfix" data-fix="${esc(entry.id)}">
      <button type="button" data-move="${esc(entry.id)}">Move to another work order</button>
      <button type="button" data-del="${esc(entry.id)}">Delete</button>
    </div>
  </article>`;
}

async function renderJob(id) {
  view.innerHTML = `<p class="loading">Loading job ${esc(id)}…</p>`;
  const data = await api('getJob', [id]);
  showTestBanner(data.testMode);
  const { job, entries, hours, props, parts, emails } = data;
  // Older deployments have no JobFiles tab until setup() has been run; the
  // card simply shows nothing rather than the page falling over.
  const files = data.files || [];
  // A mechanic can add to a job after the writer has written the rest up, so
  // the split is per entry rather than a flag on the job.
  const pending = entries.filter((entry) => !entry.loggedAt);
  const written = entries.filter((entry) => entry.loggedAt);
  // Test mode logs the held copy under its own kind, so both count as "the
  // writer has pressed send" — what differs is only who received it.
  const invoiceEmail = emails.find((mail) =>
    mail.kind === 'customer_done' || mail.kind === 'customer_done_test');
  const invoiceSent = invoiceEmail && invoiceEmail.status !== 'failed' && invoiceEmail.status !== 'skipped';

  view.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div>
        <h1 class="page-title">Job ${esc(job.id)}</h1>
        <div class="row tight" style="margin-top:6px">
          <span class="pill ${STATUS_PILL[job.status]}">${STATUS_LABEL[job.status]}</span>
          <span class="sub" style="color:var(--muted)">Opened ${formatDateTime(job.createdAt)}</span>
        </div>
      </div>
      <a class="btn ghost" href="?">Back to jobs</a>
    </div>

    <div id="notice"></div>

    ${job.needsReview.length ? `<div class="banner warn" style="margin:14px 0">
      Still needed from the work order: ${job.needsReview.map((f) => FIELD_LABELS[f] || f).join(', ')}.
      The customer cannot be emailed without an address.</div>` : ''}

    <div class="split" style="margin-top:16px">
      <div class="stack">
        <section class="card">
          <h2>Customer &amp; boat</h2>
          <form id="details">
            <label class="fld" for="customerName">Customer name</label>
            <input class="txt${job.needsReview.includes('customerName') ? ' field-flag' : ''}" id="customerName" value="${esc(job.customerName || '')}">
            <label class="fld" for="customerPhone">Phone</label>
            <input class="txt${job.needsReview.includes('customerPhone') ? ' field-flag' : ''}" id="customerPhone" value="${esc(job.customerPhone || '')}">
            <label class="fld" for="customerEmail">Email</label>
            <input class="txt${job.needsReview.includes('customerEmail') ? ' field-flag' : ''}" id="customerEmail" type="email" value="${esc(job.customerEmail || '')}">
            <label class="fld" for="boatInfo">Boat / engine</label>
            <input class="txt${job.needsReview.includes('boatInfo') ? ' field-flag' : ''}" id="boatInfo" value="${esc(job.boatInfo || '')}">

            <label class="fld" for="workRequested">What needs doing</label>
            <textarea class="txt" id="workRequested" rows="3">${esc(job.workRequested || '')}</textarea>
            <p class="hint">Shown to the mechanic when they open this job.</p>
            <button class="btn navy" type="submit" style="margin-top:14px">Save details</button>
          </form>
        </section>

        <section class="card">
          <h2>Parts for this job</h2>
          <p class="hint" style="margin-top:0">For when somebody rings up wanting a part ordered.
            It goes straight onto the <a href="?view=parts">parts list</a>, where it takes a supplier
            and order number and gets ticked off when it arrives.</p>

          ${parts && parts.length ? `<div class="ticketparts">${parts.map((part) => `
            <div class="kv">
              <span class="k">
                ${part.quantity ? `${part.quantity}&times; ` : ''}<b style="font-family:var(--mono)">${esc(part.partIdentifier || '(no number)')}</b>
                ${part.description ? `<span class="sub"> · ${esc(part.description)}</span>` : ''}
              </span>
              <b><span class="pill ${{ needed: 'red', ordered: 'gold', received: 'green' }[part.status]}">${
                { needed: 'To order', ordered: 'On order', received: 'Arrived' }[part.status] || esc(part.status)
              }</span></b>
            </div>
            ${part.vendor ? `<div class="sub" style="margin:-4px 0 8px">${esc(part.vendor)}${part.orderNumber ? ` · order ${esc(part.orderNumber)}` : ''}</div>` : ''}`).join('')}</div>`
            : ''}

          <label class="fld" for="jobpartnum">Part number</label>
          <input class="txt mono" id="jobpartnum" placeholder="Optional — a description will do">
          <label class="fld" for="jobpartdesc">What is it</label>
          <input class="txt" id="jobpartdesc" placeholder="Impeller kit, 3.0L">
          <div class="grid2">
            <div>
              <label class="fld" for="jobpartqty">How many</label>
              <input class="txt mono" id="jobpartqty" inputmode="decimal" placeholder="1">
            </div>
            <div>
              <label class="fld" for="jobpartnote">Note (optional)</label>
              <input class="txt" id="jobpartnote" placeholder="Customer called Tuesday">
            </div>
          </div>
          <button class="btn ghost block" type="button" id="addjobpart" style="margin-top:10px">Add to the parts list</button>
        </section>

        <section class="card">
          <h2>Close out checklist</h2>
          <label class="checkline" style="border-top:0;padding-top:0;margin-top:0">
            <input type="checkbox" id="ck-logged" ${pending.length === 0 && entries.length ? 'checked' : ''} ${entries.length ? '' : 'disabled'}>
            <span>Parts and labor logged on the ticket
              <small>${entries.length
                ? (pending.length ? `${pending.length} entr${pending.length === 1 ? 'y' : 'ies'} still to write up` : 'All caught up')
                : 'Nothing logged on this job yet'}</small></span>
          </label>
          <label class="checkline">
            <input type="checkbox" id="ck-parts" ${job.partsOrderedAt ? 'checked' : ''}>
            <span>Parts ordered
              <small>${job.partsOrderedAt ? `Ticked ${formatDate(job.partsOrderedAt)}` : 'Anything this job is waiting on is on the parts list'}</small></span>
          </label>
          <label class="checkline">
            <input type="checkbox" id="ck-paid" ${job.paidAt ? 'checked' : ''}>
            <span>Invoice paid, ticket closed
              <small>${job.paidAt ? `Ticked ${formatDate(job.paidAt)}` : 'Your own record — it changes nothing the customer sees'}</small></span>
          </label>
        </section>

        <section class="card">
          <h2>Close out</h2>
          <form id="invoiceform">
            <label class="fld" for="invoice">Final invoice PDF (from BiT — no QR needed)</label>
            <input class="txt" id="invoice" type="file" accept="application/pdf">
            ${job.invoiceFile ? `<p class="hint">On file:
              <a href="${driveFileUrl(job.invoiceFile)}" target="_blank" rel="noreferrer">invoice-${esc(job.id)}.pdf</a>
              — uploading again replaces it.</p>` : ''}
            <p class="msg" id="totalsmsg"></p>

            <label class="fld" for="amountDue">Amount due${job.deposits ? ` (after ${formatMoney(job.deposits)} in deposits)` : ''}</label>
            <input class="txt mono" id="amountDue" inputmode="decimal" placeholder="read from the invoice"
              value="${job.amountDue === null ? '' : job.amountDue.toFixed(2)}">
            <input type="hidden" id="grandTotal" value="${job.grandTotal === null ? '' : job.grandTotal}">
            <input type="hidden" id="deposits" value="${job.deposits === null ? '' : job.deposits}">
            <p class="hint">Read off the invoice when you upload it, and shown to the customer with
              the payment link. Deposits mean this is not the grand total — check it before you send.</p>

            <label class="fld" for="paymentLink">POS+ payment link</label>
            <input class="txt mono" id="paymentLink" placeholder="https://..." value="${esc(job.paymentLink || '')}">
            <p class="hint">Generate the link in POS+ and paste it here — we only store it.</p>
            <button class="btn ghost" type="submit" style="margin-top:14px">Save invoice &amp; link</button>
          </form>

          <hr style="border:0;border-top:1px solid var(--ice);margin:18px 0">

          ${job.status === 'done' ? `
            <div class="banner ok">Marked done ${formatDateTime(job.doneAt)}.</div>
            ${invoiceSent
              ? `<p class="hint" style="margin:12px 0 8px">Invoice emailed ${formatDateTime(invoiceEmail.created_at)}
                 to ${esc(invoiceEmail.recipient)}${data.testMode ? ' — test mode, so that was the shop, not the customer' : ''}.</p>`
              : `<p class="hint" style="margin:12px 0 8px">Nothing has been emailed to this customer. Sending is a
                 separate, deliberate step — closing a ticket never posts mail by itself.</p>`}
            <button class="btn ${invoiceSent ? 'ghost' : 'gold'} block" type="button" id="sendinvoice"${job.customerEmail ? '' : ' disabled title="Add a customer email address first"'}>
              ${invoiceSent ? 'Send the invoice email again' : 'Email the invoice to the customer'}
            </button>
            ${job.customerEmail ? '' : '<p class="hint" style="margin-top:8px">No email address on file for this customer.</p>'}`
          : `
            <p class="hint" style="margin-bottom:10px">Closes the ticket. It sends nothing —
              emailing the invoice is a separate button once the job is done.</p>
            <button class="btn gold block" type="button" id="markdone">Mark done</button>
            <form id="statusform" style="margin-top:12px">
              <label class="fld" for="status">Or set the shop status by hand</label>
              <div class="row tight" style="flex-wrap:nowrap">
                <select class="txt" id="status">
                  ${STATUSES.filter((s) => s !== 'done').map((s) => `<option value="${s}"${s === job.status ? ' selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
                </select>
                <button class="btn ghost sm" type="submit">Set</button>
              </div>
            </form>`}
        </section>
      </div>

      <div class="stack">
        <section class="card${job.alert ? ' alerting' : ''}">
          <h2>For the mechanic</h2>
          <p class="hint" style="margin-top:0">Two ways to reach the floor, neither of which the
            customer ever sees. An alert is for what cannot be missed; a note is for everything else.</p>

          <div class="subhead">Alert banner</div>
          ${job.alert ? `
            <div class="alertbox">
              <div class="alertbox-tag">Showing on the mechanic's screen</div>
              <div class="alertbox-text">${esc(job.alert)}</div>
              ${job.alertAt ? `<div class="alertbox-when">Set ${formatDateTime(job.alertAt)}</div>` : ''}
            </div>
            <button class="btn ghost block" type="button" id="clearalert" style="margin-top:10px">Take it down</button>
            <p class="hint">Take it down once it has been acted on — a banner that is always up is one
              nobody reads. What it said stays in the shop log either way.</p>`
          : `
            <p class="hint" style="margin-top:0">Hold the job, call the owner first, do not order the
              part. Goes across the top of the job in red and pushes it to the top of the open-jobs
              list.</p>
            <textarea class="txt" id="alerttext" rows="2"
              placeholder="Do not start — owner is disputing the estimate."></textarea>
            <button class="btn red block" type="button" id="setalert" style="margin-top:10px">Put up the alert</button>`}

          <div class="subhead">Note in the shop log</div>
          <p class="hint" style="margin-top:0">Sits in the log with everything else, where whoever is
            working the boat will read it.</p>
          <textarea class="txt" id="writernote" rows="2"
            placeholder="Owner wants a call before you pull the lower unit…"></textarea>
          <button class="btn ghost block" type="button" id="addnote" style="margin-top:10px">Add the note</button>
        </section>

        <section class="card">
          <h2>Paperwork</h2>
          <div class="stack">
            ${job.workOrderFile
              ? `<a class="btn ghost" href="${driveFileUrl(job.workOrderFile)}" target="_blank" rel="noreferrer">Open stamped work order (PDF)</a>`
              : `<div class="banner warn">No stamped work order on file. Re-run intake if the printed copy has no QR code.</div>`}
            <label class="fld">Work order link (shop only)</label>
            <div class="row tight" style="flex-wrap:nowrap">
              <input class="txt mono" readonly value="${esc(job.trackingUrl)}" id="tracklink">
              <button class="btn ghost sm" type="button" id="copy">Copy</button>
            </div>
            <p class="hint">The address the QR code on the work order carries — what a mechanic's
              phone opens when they scan it. Not for customers.</p>

            <div class="restamp">
              <label class="fld" for="restamp">Re-stamp the work order</label>
              <p class="hint" style="margin-top:0">A customer adds to the job after you have
                printed it: change it in BiT, download the new copy and drop it here. It gets the
                <b>same QR code</b> as the first one, so any sheet already printed still opens this
                job — and the mechanic gets the whole description on paper instead of a note to
                notice.</p>
              <input id="restamp" type="file" accept="application/pdf">
              <div id="restampmsg"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Attachments${files.length ? ` (${files.length})` : ''}</h2>
          <p class="hint" style="margin-top:0">Anything else that belongs on this job — a photo of
            what you found, a supplier quote. You say which kind as you add it, and that is the
            only thing that decides whether a customer ever sees it.</p>

          ${files.length ? `<div class="filelist">${files.map((file) => `
            <div class="filerow">
              <span class="pill ${file.visibility === 'customer' ? 'green' : 'grey'}">${
                file.visibility === 'customer' ? 'Customer' : 'Internal'}</span>
              <a class="grow" href="${driveFileUrl(file.driveFile)}" target="_blank" rel="noreferrer">${esc(file.name)}</a>
              <button type="button" data-delfile="${esc(file.id)}" aria-label="Remove ${esc(file.name)}">Remove</button>
            </div>`).join('')}</div>` : ''}

          <label class="fld" for="jobfile">Add a file</label>
          <input id="jobfile" type="file">
          <div class="row tight" style="margin-top:10px">
            <button class="btn ghost sm" type="button" id="addfilecustomer" disabled>Attach for the customer</button>
            <button class="btn ghost sm" type="button" id="addfileinternal" disabled>Keep internal</button>
          </div>
          <p class="hint">A customer file is attached to the invoice email when you send it.
            An internal one never leaves the shop.</p>
          <div id="filemsg"></div>
        </section>

        ${job.amountDue !== null ? `<section class="card">
          <h2>What the customer owes</h2>
          <div class="hourstotal">${formatMoney(job.amountDue)}</div>
          ${job.grandTotal !== null ? `<div class="kv"><span class="k">Grand total</span>
            <b style="font-family:var(--mono)">${formatMoney(job.grandTotal)}</b></div>` : ''}
          ${job.deposits ? `<div class="kv"><span class="k">Deposits already paid</span>
            <b style="font-family:var(--mono)">${formatMoney(job.deposits)}</b></div>` : ''}
          <p class="hint">Shown in the invoice email next to the payment link.</p>
        </section>` : ''}

        <section class="card">
          <h2>Labor logged</h2>
          ${hours.total ? `
            <div class="hourstotal">${formatHours(hours.total)}</div>
            <div class="forbit">${decimalHours(hours.total)} to key into BiT</div>
            ${hours.byMechanic.map((row) => `<div class="kv"><span class="k">${esc(row.name)}</span>
              <b style="font-family:var(--mono)">${formatHours(row.hours)}
                <span class="dim">· ${decimalHours(row.hours)}</span></b></div>`).join('')}
            <p class="hint">Mechanics log the time in hours and minutes as they work. BiT wants it as a
              decimal, so both are here — the second figure is the one to type. The customer never sees
              either.</p>`
            : `<p class="hint" style="margin:0">No time logged yet. Mechanics add it from the job screen
              as they finish each stint.</p>`}
        </section>

        ${props && props.length ? `<section class="card">
          <h2>Props out (${props.length})</h2>
          <div class="proplist">${props.map((prop) => `
            <div class="proprow">
              ${prop.tagPhoto
                ? `<a href="${driveFileUrl(prop.tagPhoto.full)}" target="_blank" rel="noopener"><img
                     src="${driveImageUrl(prop.tagPhoto.thumb)}" alt="Tag"></a>`
                : `<div class="notag">no tag<br>photo</div>`}
              <div class="grow">
                <div class="who">${esc(prop.description || 'Prop')}</div>
                <div class="sub">${esc(prop.statusLabel)}${prop.vendor ? ` · ${esc(prop.vendor)}` : ''}</div>
              </div>
            </div>`).join('')}</div>
          <p class="hint">Moved along from the <a href="?view=props">props list</a>.</p>
        </section>` : ''}

        <section class="card">
          <h2>Shop log (${entries.length})${hours.total ? ` · ${formatHours(hours.total)} logged` : ''}</h2>
          ${entries.length ? `
            ${pending.length ? `
              <div class="row" style="justify-content:space-between;margin-bottom:8px">
                <b style="color:var(--navy)">Still to write up in BiT (${pending.length})</b>
                <button class="btn ghost sm" type="button" id="marklogged">Mark these written up</button>
              </div>
              <div class="feed">${pending.map(entryHtml).join('')}</div>`
              : `<div class="banner ok" style="margin-bottom:10px">Everything logged so far is written up in BiT.</div>`}

            ${written.length ? `
              <details style="margin-top:14px">
                <summary style="cursor:pointer;color:var(--muted);font-weight:600">
                  Already written up (${written.length})
                </summary>
                <div class="feed" style="margin-top:10px;opacity:.72">${written.map(entryHtml).join('')}</div>
              </details>` : ''}`
            : `<div class="empty">Nothing logged yet. Entries appear here as mechanics add them.</div>`}
        </section>

        <section class="card">
          <h2>Timeline</h2>
          <p class="hint" style="margin-top:0">When this job changed hands and status.</p>
          <button class="btn ghost block" type="button" id="showhistory">Show the timeline</button>
          <div id="history"></div>
        </section>

        ${emails.length ? `<section class="card">
          <h2>Email log</h2>
          ${emails.map((mail) => `<div class="kv">
            <span class="k">${formatDateTime(mail.created_at)} · ${esc(String(mail.kind).replace('_', ' '))}</span>
            <b><span class="pill ${mail.status === 'sent' ? 'green' : mail.status === 'skipped' ? 'grey' : 'red'}">${esc(mail.status)}</span>
              <div style="font-weight:400;font-size:12px;color:var(--muted)">${esc(mail.recipient)}${mail.error ? ` — ${esc(mail.error)}` : ''}</div></b>
          </div>`).join('')}
        </section>` : ''}
      </div>
    </div>`;

  const notice = (tone, message) => {
    $('notice').innerHTML = `<div class="banner ${tone}" style="margin:14px 0">${esc(message)}</div>`;
  };

  /**
   * Putting a misfiled entry right.
   *
   * A mechanic scans the wrong work order off a bench with three of them on
   * it, and the note is right but on the wrong boat. Moving beats deleting
   * and re-typing — the words, the photos and the hours all travel, and the
   * time lands on the invoice it belongs to.
   */
  view.querySelectorAll('[data-move]').forEach((button) => {
    button.onclick = () => {
      const box = button.closest('.entryfix');
      box.innerHTML = `
        <label class="fld" for="moveto">Move to work order</label>
        <div class="row tight" style="flex-wrap:nowrap">
          <input class="txt mono" id="moveto" placeholder="01-8886" autocomplete="off">
          <button class="btn ghost sm" type="button" id="movego">Move</button>
          <button class="btn ghost sm" type="button" id="movestop">Cancel</button>
        </div>
        <p class="hint">Everything on the entry goes with it, and the hours come off this
          job's total and land on that one.</p>`;
      $('moveto').focus();
      $('movestop').onclick = () => renderJob(job.id);
      const go = async () => {
        const to = $('moveto').value.trim();
        if (!to) return;
        $('movego').disabled = true;
        $('movego').textContent = 'Moving…';
        try {
          const result = await api('moveEntry', [button.dataset.move, to]);
          await renderJob(job.id);
          toast(`Moved to ${result.to}.`);
        } catch (error) {
          $('movego').disabled = false;
          $('movego').textContent = 'Move';
          notice('warn', error.message);
        }
      };
      $('movego').onclick = go;
      $('moveto').onkeydown = (event) => { if (event.key === 'Enter') go(); };
    };
  });

  view.querySelectorAll('[data-del]').forEach((button) => {
    button.onclick = async () => {
      if (!confirm('Delete this entry? This cannot be undone.')) return;
      button.disabled = true;
      try {
        const result = await api('deleteEntry', [button.dataset.del]);
        await renderJob(job.id);
        toast(result.removedParts
          ? `Entry deleted, and ${result.removedParts} part line with it.`
          : 'Entry deleted.');
      } catch (error) {
        button.disabled = false;
        notice('warn', error.message);
      }
    };
  });

  const marklogged = $('marklogged');
  if (marklogged) marklogged.onclick = async () => {
    try {
      const result = await api('markLogged', [job.id]);
      renderJob(job.id);
      toast(`${result.logged} written up.`);
    } catch (error) { notice('warn', error.message); }
  };
  const tickLogged = $('ck-logged');
  if (tickLogged) tickLogged.onclick = (event) => {
    // The tick is a readout of the entries, not a switch of its own.
    event.preventDefault();
    if (pending.length) marklogged && marklogged.click();
  };
  [['ck-parts', 'partsOrdered'], ['ck-paid', 'paid']].forEach(([id, flag]) => {
    const box = $(id);
    if (!box) return;
    box.onchange = async () => {
      try {
        await api('setJobFlag', [job.id, flag, box.checked]);
        renderJob(job.id);
      } catch (error) { box.checked = !box.checked; notice('warn', error.message); }
    };
  });

  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(job.trackingUrl);
      toast('Work order link copied.');
    } catch {
      $('tracklink').select();
    }
  };

  /**
   * A new BiT copy of a job that already exists, stamped with the SAME QR.
   *
   * The token does not change, so the sheets already in the folder keep
   * working and the shop never has to chase down a printed copy. What the
   * mechanic gets is the current description on paper, rather than an old
   * sheet plus a hope that somebody reads the note in the app.
   */
  /**
   * Documents on the job, each marked for the customer or for the shop.
   *
   * Two buttons rather than a radio and one: which button you press IS the
   * choice, so it cannot be made by not noticing a default. The wrong outcome
   * here is a supplier's cost sheet leaving with an invoice, and that is not
   * a mistake to leave one unticked box away.
   */
  const jobfile = $('jobfile');
  if (jobfile) {
    const filebuttons = [$('addfilecustomer'), $('addfileinternal')];
    jobfile.onchange = () => {
      filebuttons.forEach((button) => { button.disabled = !jobfile.files[0]; });
      $('filemsg').innerHTML = '';
    };

    const addFile = async (visibility, button) => {
      const file = jobfile.files[0];
      if (!file) return;
      // Gmail will not carry more than about 25MB in total, and a phone photo
      // dropped in whole is the usual way that gets found out.
      if (file.size > 10 * 1024 * 1024) {
        $('filemsg').innerHTML = '<div class="msg err">That file is over 10MB. '
          + 'Anything larger has to go in Drive and be linked by hand.</div>';
        return;
      }
      filebuttons.forEach((b) => { b.disabled = true; });
      button.textContent = 'Attaching…';
      try {
        await api('addJobFile', [job.id, {
          name: file.name,
          mime: file.type || 'application/octet-stream',
          visibility: visibility,
          base64: bytesToBase64(new Uint8Array(await file.arrayBuffer())),
        }]);
        renderJob(job.id);
        toast(visibility === 'customer'
          ? 'Attached. It goes with the invoice email.'
          : 'Attached, internal only.');
      } catch (error) {
        $('filemsg').innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
        filebuttons.forEach((b) => { b.disabled = false; });
        button.textContent = visibility === 'customer' ? 'Attach for the customer' : 'Keep internal';
      }
    };
    $('addfilecustomer').onclick = () => addFile('customer', $('addfilecustomer'));
    $('addfileinternal').onclick = () => addFile('internal', $('addfileinternal'));
  }

  view.querySelectorAll('[data-delfile]').forEach((button) => {
    button.onclick = async () => {
      if (!confirm('Remove this attachment? It goes to the Drive bin, where it can be recovered for thirty days.')) return;
      button.disabled = true;
      try {
        await api('deleteJobFile', [button.dataset.delfile]);
        renderJob(job.id);
        toast('Attachment removed.');
      } catch (error) {
        button.disabled = false;
        notice('warn', error.message);
      }
    };
  });

  const restamp = $('restamp');
  if (restamp) restamp.onchange = async () => {
    const file = restamp.files[0];
    if (!file) return;
    const say = (tone, html) => { $('restampmsg').innerHTML = `<div class="msg ${tone}">${html}</div>`; };
    restamp.disabled = true;
    say('', 'Reading the PDF…');
    try {
      if (file.type !== 'application/pdf') {
        throw new Error('That does not look like a PDF. Download the work order from BiT and try again.');
      }
      const bytes = new Uint8Array(await file.arrayBuffer());
      const extracted = await extractPdf(bytes);
      const parsed = parseWorkOrder(extracted);

      // Stamping this job's QR onto another job's paper would send a mechanic
      // to the wrong boat, so a number that reads as a DIFFERENT job stops
      // here. A PDF with no text layer proves nothing either way and is
      // allowed through with a word about it.
      if (parsed.invoiceNumber && parsed.invoiceNumber !== job.id) {
        throw new Error(`That PDF is work order ${parsed.invoiceNumber}, not ${job.id}. `
          + 'Open that job to re-stamp it.');
      }

      say('', 'Stamping the QR code…');
      const stamped = await stampWorkOrder({
        pdfBytes: bytes,
        trackingUrl: job.trackingUrl,
        invoiceNumber: job.id,
        firstPage: extracted.pages[0],
      });
      await api('attachWorkOrder', [job.id, bytesToBase64(stamped)]);

      const url = URL.createObjectURL(new Blob([stamped], { type: 'application/pdf' }));
      const fresh = (parsed.workRequested || '').trim();
      const differs = fresh && fresh !== (job.workRequested || '').trim();
      say('ok', `Re-stamped, same QR code as before.
        ${parsed.invoiceNumber ? '' : '<div style="margin-top:4px">That PDF had no text layer, so the work order number could not be checked against this job.</div>'}
        <div class="stack" style="margin-top:10px">
          <a class="btn navy" href="${url}" target="_blank" rel="noreferrer">Open print-ready work order</a>
          ${differs ? `<button class="btn ghost" type="button" id="usedesc">Update what needs doing to match</button>` : ''}
        </div>
        ${differs ? `<p class="hint" style="margin-top:8px">The new copy says:
          &ldquo;${esc(fresh)}&rdquo;</p>` : ''}`);

      // Offered rather than applied: the writer may have already typed a
      // better version of this by hand, and a silent overwrite of it would be
      // the worst outcome of pressing a button labelled "re-stamp".
      const usedesc = $('usedesc');
      if (usedesc) usedesc.onclick = async () => {
        usedesc.disabled = true;
        try {
          await api('saveJobDetails', [job.id, {
            customerName: job.customerName || '',
            customerPhone: job.customerPhone || '',
            customerEmail: job.customerEmail || '',
            boatInfo: job.boatInfo || '',
            workRequested: fresh,
          }]);
          renderJob(job.id);
          toast('What needs doing now matches the new work order.');
        } catch (error) {
          usedesc.disabled = false;
          say('err', esc(error.message));
        }
      };
    } catch (error) {
      say('err', esc(error.message));
    }
    restamp.disabled = false;
    restamp.value = '';
  };

  $('details').onsubmit = async (event) => {
    event.preventDefault();
    try {
      await api('saveJobDetails', [job.id, {
        customerName: $('customerName').value,
        customerPhone: $('customerPhone').value,
        customerEmail: $('customerEmail').value,
        boatInfo: $('boatInfo').value,
        workRequested: $('workRequested').value,
      }]);
      renderJob(job.id);
      toast('Customer details saved.');
    } catch (error) { notice('warn', error.message); }
  };

  // Reading the invoice as soon as it is chosen, so the figures are on screen
  // to be checked rather than discovered by the customer.
  $('invoice').onchange = async () => {
    const file = $('invoice').files[0];
    const message = $('totalsmsg');
    if (!file) return;
    message.className = 'msg';
    message.innerHTML = '<span class="spinner"></span> Reading the invoice…';
    try {
      const totals = parseInvoiceTotals(await extractPdf(new Uint8Array(await file.arrayBuffer())));
      if (totals.amountDue === null) {
        message.className = 'msg err';
        message.textContent = 'Could not find an amount due on that invoice — type it in below.';
        return;
      }
      $('amountDue').value = totals.amountDue.toFixed(2);
      $('grandTotal').value = totals.grandTotal === null ? '' : totals.grandTotal;
      $('deposits').value = totals.deposits === null ? '' : totals.deposits;
      message.className = 'msg ok';
      message.textContent = totals.deposits
        ? `Grand total ${formatMoney(totals.grandTotal)}, less ${formatMoney(totals.deposits)} in deposits — ${formatMoney(totals.amountDue)} due.`
        : `${formatMoney(totals.amountDue)} due.`;
    } catch (error) {
      message.className = 'msg err';
      message.textContent = `Could not read that invoice: ${error.message}`;
    }
  };

  $('invoiceform').onsubmit = async (event) => {
    event.preventDefault();
    const file = $('invoice').files[0];
    const button = event.target.querySelector('button');
    button.disabled = true;
    try {
      let base64 = null;
      if (file) {
        if (file.type !== 'application/pdf') throw new Error('That invoice file was not a PDF.');
        base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = () => reject(new Error('Could not read that file.'));
          reader.readAsDataURL(file);
        });
      }
      const number = (id) => ($(id).value.trim() === '' ? null : Number($(id).value));
      await api('saveInvoice', [job.id, $('paymentLink').value.trim(), base64, {
        grandTotal: number('grandTotal'),
        deposits: number('deposits'),
        amountDue: number('amountDue'),
      }]);
      renderJob(job.id);
      toast('Invoice and payment link saved.');
    } catch (error) {
      button.disabled = false;
      notice('warn', error.message);
    }
  };

  const showhistory = $('showhistory');
  if (showhistory) showhistory.onclick = async () => {
    showhistory.disabled = true;
    showhistory.textContent = 'Loading…';
    try {
      const { timeline } = await api('jobHistory', [job.id]);
      showhistory.remove();
      $('history').innerHTML = timeline.length
        ? timeline.map((event) => `<div class="kv">
            <span class="k">${formatDateTime(event.created_at)}</span>
            <b>${STATUS_LABEL[event.to_status]}<span style="color:var(--muted);font-weight:400"> · ${esc(String(event.actor_type).replace('_', ' '))}</span></b>
          </div>`).join('')
        : `<p class="hint" style="margin:0">Nothing recorded yet.</p>`;
    } catch (error) {
      showhistory.disabled = false;
      showhistory.textContent = 'Show the history';
      notice('warn', error.message);
    }
  };

  const addjobpart = $('addjobpart');
  if (addjobpart) addjobpart.onclick = async () => {
    const partIdentifier = $('jobpartnum').value.trim();
    const description = $('jobpartdesc').value.trim();
    if (!partIdentifier && !description) {
      return notice('warn', 'Say which part — a number, a description, or both.');
    }
    addjobpart.disabled = true;
    addjobpart.textContent = 'Adding…';
    try {
      await api('addJobPart', [job.id, {
        partIdentifier, description,
        quantity: $('jobpartqty').value.trim(),
        notes: $('jobpartnote').value.trim(),
      }]);
      renderJob(job.id);
      toast('On the parts list.');
    } catch (error) {
      addjobpart.disabled = false;
      addjobpart.textContent = 'Add to the parts list';
      notice('warn', error.message);
    }
  };

  const setalert = $('setalert');
  if (setalert) setalert.onclick = async () => {
    const text = $('alerttext').value.trim();
    if (!text) return notice('warn', 'Write the alert first.');
    setalert.disabled = true;
    setalert.textContent = 'Putting it up…';
    try {
      await api('setJobAlert', [job.id, text]);
      renderJob(job.id);
      toast('Alert is up on the mechanic\u2019s screen.');
    } catch (error) {
      setalert.disabled = false;
      setalert.textContent = 'Put up the alert';
      notice('warn', error.message);
    }
  };

  const clearalert = $('clearalert');
  if (clearalert) clearalert.onclick = async () => {
    clearalert.disabled = true;
    clearalert.textContent = 'Taking it down…';
    try {
      await api('setJobAlert', [job.id, '']);
      renderJob(job.id);
      toast('Alert taken down.');
    } catch (error) {
      clearalert.disabled = false;
      clearalert.textContent = 'Take it down';
      notice('warn', error.message);
    }
  };

  const addnote = $('addnote');
  if (addnote) addnote.onclick = async () => {
    const box = $('writernote');
    const text = box.value.trim();
    if (!text) return notice('warn', 'Write the note first.');
    addnote.disabled = true;
    addnote.textContent = 'Adding…';
    try {
      await api('addWriterNote', [job.id, text]);
      box.value = '';
      renderJob(job.id);
      toast('Note added to the shop log.');
    } catch (error) {
      addnote.disabled = false;
      addnote.textContent = 'Add the note';
      notice('warn', error.message);
    }
  };

  const markdone = $('markdone');
  if (markdone) markdone.onclick = async () => {
    markdone.disabled = true;
    markdone.textContent = 'Closing…';
    try {
      await api('markDone', [job.id]);
      renderJob(job.id);
      toast('Marked done. Nothing has been emailed.');
    } catch (error) {
      markdone.disabled = false;
      markdone.textContent = 'Mark done';
      notice('warn', error.message);
    }
  };

  const sendinvoice = $('sendinvoice');
  if (sendinvoice) sendinvoice.onclick = async () => {
    const to = job.customerEmail;
    if (!confirm(`Email the invoice for ${job.id} to ${to}?`)) return;
    sendinvoice.disabled = true;
    sendinvoice.textContent = 'Sending…';
    try {
      const result = await api('sendInvoiceEmail', [job.id]);
      renderJob(job.id);
      toast(!result.emailed ? 'That email did not send — check the log.'
        : result.testMode ? `Test mode: it went to ${result.sentTo}, not the customer.`
        : `Invoice emailed to ${result.sentTo}.`);
    } catch (error) {
      sendinvoice.disabled = false;
      sendinvoice.textContent = 'Email the invoice to the customer';
      notice('warn', error.message);
    }
  };

  const statusform = $('statusform');
  if (statusform) statusform.onsubmit = async (event) => {
    event.preventDefault();
    try {
      await api('setStatus', [job.id, $('status').value]);
      renderJob(job.id);
      toast('Status updated.');
    } catch (error) { notice('warn', error.message); }
  };
}

function renderIntake() {
  view.className = 'wrap narrow';
  view.innerHTML = `
    <h1 class="page-title">New work order</h1>
    <p class="lead">
      Upload the work order you just downloaded from BiT. Your browser reads the invoice number,

        <p class="hint">Nothing is created until you confirm the details on the next step.</p>
        <p class="msg" id="readmsg"></p>
      </div>

      <div class="stage" id="stage-review"></div>
      <div class="stage" id="stage-done"></div>
    </section>`;

  const drop = $('drop');
  const input = $('pdf');
  drop.onclick = () => input.click();
  drop.ondragover = (event) => { event.preventDefault(); drop.classList.add('hot'); };

  drop.ondrop = (event) => {
    event.preventDefault();
    drop.classList.remove('hot');
    if (event.dataTransfer.files[0]) readPdf(event.dataTransfer.files[0]);
  };
  input.onchange = () => { if (input.files[0]) readPdf(input.files[0]); };
}

function showStage(name) {
  ['upload', 'review', 'done'].forEach((stage) => {
    $(`stage-${stage}`).classList.toggle('on', stage === name);
  });
}

async function readPdf(file) {
  $('readmsg').textContent = 'Reading the PDF…';
  try {
    if (file.type !== 'application/pdf') throw new Error('That does not look like a PDF. Download the work order from BiT and try again.');
    const bytes = new Uint8Array(await file.arrayBuffer());
    const extracted = await extractPdf(bytes);
    const parsed = parseWorkOrder(extracted);
    intake = { bytes, extracted, parsed, filename: file.name };
    renderReview();
  } catch (error) {
    $('readmsg').textContent = error.message;
    $('readmsg').className = 'msg err';
  }
}

function renderReview() {
  const { parsed, extracted, filename } = intake;
  const fields = [
    ['invoiceNumber', 'Invoice # (this becomes the job number)', 'mono'],
    ['customerName', 'Customer name', ''],
    ['customerPhone', 'Phone', ''],
    ['customerEmail', 'Email (needed for the final invoice email)', ''],
    ['boatInfo', 'Boat / engine', ''],
  ];
  $('stage-review').innerHTML = `
    <h2>Check what we read</h2>
    ${!extracted.lines.length ? `<div class="banner warn" style="margin-bottom:12px">
      That PDF has no text layer — it looks like a scan. Type the details in by hand, or re-download
      the work order straight from BiT.</div>` : ''}
    ${parsed.missing.length ? `<div class="banner info" style="margin-bottom:12px">
      Could not find: ${parsed.missing.map((f) => FIELD_LABELS[f] || f).join(', ')}. Fill in what you can —
      the highlighted fields are the ones we found nothing for.</div>` : ''}
    ${fields.map(([key, label, extra]) => `
      <label class="fld" for="${key}">${label}</label>
      <input class="txt ${extra} ${parsed.missing.includes(key) ? 'field-flag' : ''}" id="${key}" value="${esc(parsed[key] || '')}">

    <label class="fld" for="workRequested">What needs doing</label>
    <textarea class="txt" id="workRequested" rows="3">${esc(parsed.workRequested || '')}</textarea>

      job, so it matters most when they are working from the boat rather than the paper.</p>
    <div class="row" style="margin-top:16px">
      <button class="btn navy" type="button" id="create">Create job &amp; stamp the QR code</button>
      <button class="btn ghost" type="button" id="restart">Start over</button>
    </div>
    <p class="hint">Read from ${esc(filename)}.</p>
    <p class="msg" id="createmsg"></p>`;
  showStage('review');

  $('restart').onclick = () => { intake = null; renderIntake(); };
  $('create').onclick = createJob;

async function createJob() {
  const button = $('create');
  const message = $('createmsg');
  const invoiceNumber = $('invoiceNumber').value.trim().toUpperCase();
  if (!invoiceNumber) {
    message.className = 'msg err';
    message.textContent = 'An invoice number is required — it identifies the job.';
    return;
  }
  button.disabled = true;
  message.className = 'msg';
  message.innerHTML = '<span class="spinner"></span> Stamping the QR code…';

  try {
    // The token has to exist before the QR can point at it, so the job row is
    // created first and the stamped PDF is attached a moment later.
    const created = await api('createJob', [{
      invoiceNumber,
      customerName: $('customerName').value.trim(),
      customerPhone: $('customerPhone').value.trim(),
      customerEmail: $('customerEmail').value.trim(),
      boatInfo: $('boatInfo').value.trim(),
      workRequested: $('workRequested').value.trim(),
    }]);
    const job = created.job;

    const stamped = await stampWorkOrder({
      pdfBytes: intake.bytes,
      trackingUrl: trackingUrl(SITE_URL, job.token),
      invoiceNumber: job.id,
      firstPage: intake.extracted.pages[0],
    });
    try {
      await api('attachWorkOrder', [job.id, bytesToBase64(stamped)]);
      renderCreated(job, stamped, null);
    } catch (attachError) {
      // The job exists and is usable; only the stored copy failed. Say so
      // plainly rather than pretending intake worked end to end — and still
      // hand over the stamped PDF, which is the thing that gets printed.
      renderCreated(job, stamped, attachError.message);
    }
  } catch (error) {
    button.disabled = false;
    message.className = 'msg err';
    message.textContent = error.message;
  }
}

function renderCreated(job, stampedBytes, warning) {
  const url = URL.createObjectURL(new Blob([stampedBytes], { type: 'application/pdf' }));
  $('stage-done').innerHTML = `
    <h2>Job ${esc(job.id)} created</h2>
    <div class="banner ${warning ? 'warn' : 'ok'}" style="margin-bottom:14px">
      ${warning
        ? `The job was created, but the stamped copy did not save to Drive: ${esc(warning)}
           Print it from the button below and re-upload it from the job page when you get a chance.`
        : 'Print the stamped work order and put it in the folder exactly as you do today.'}
    </div>
    <div class="stack">
      <a class="btn navy" href="${url}" target="_blank" rel="noreferrer">Open print-ready work order</a>
      <label class="fld">Work order link (shop only)</label>
      <div class="row tight" style="flex-wrap:nowrap">
        <input class="txt mono" readonly value="${esc(trackingUrl(SITE_URL, job.token))}" id="newlink">
        <button class="btn ghost sm" type="button" id="copynew">Copy</button>
      </div>
      <div class="row">
        <a class="btn ghost" href="?job=${encodeURIComponent(job.id)}">Open the job</a>
        <button class="btn ghost" type="button" id="again">Do another</button>
      </div>
    </div>`;
  showStage('done');
  $('again').onclick = () => { intake = null; renderIntake(); };
  $('copynew').onclick = async () => {
    try { await navigator.clipboard.writeText($('newlink').value); toast('Work order link copied.'); }
    catch { $('newlink').select(); }
  };
}

  const tail = [];
  if (part.jobId) tail.push(`<a href="?job=${encodeURIComponent(part.jobId)}">job ${esc(part.jobId)}</a>`);
  if (part.customerName) tail.push(esc(part.customerName));
  if (part.requestedBy) tail.push(esc(part.requestedBy));

  return `<div class="partrow" data-part="${esc(part.id)}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px">
      <div style="flex:1;min-width:0">
