<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leave Quest Watersports a review</title>
<!--
  A doorway to the shop's Google review box, and the ONLY reason it exists is
  Gmail.

  Gmail rewrites every link in a message it renders as google.com/url?q=...,
  and that redirector will not silently forward to a google.com destination —
  it shows the reader a "Redirect Notice" warning page first. So a review
  button pointing straight at search.google.com cost the customer a scare
  screen before they ever reached the stars, and swapping one Google URL for
  another does nothing: the destination being on google.com IS the trigger.

  A link to this page is not on google.com, so Gmail forwards it without
  comment, and the hop from here to Google is an ordinary navigation that
  nothing wraps. One extra redirect, no warning page.

  The g.page/r/.../review short link would also dodge it, being on g.page —
  but that comes from the Business Profile, which the shop cannot reach. This
  needs nothing from Google at all.
-->
<meta name="robots" content="noindex">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #EBF1F6; color: #1D2B38; text-align: center; padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .card { max-width: 420px; }
  h1 { font-size: 19px; margin: 0 0 10px; color: #14293E; }
  p { font-size: 15px; line-height: 1.5; margin: 0 0 18px; color: #4A5A68; }
  a.go {
    display: inline-block; background: #C08A22; color: #fff; text-decoration: none;
    font-weight: bold; font-size: 16px; padding: 14px 28px; border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Taking you to Google&hellip;</h1>
    <p>One moment. If nothing happens, use the button.</p>
    <!-- Filled in by the script below, and the whole of what a reader without
         JavaScript gets. Never left pointing at nothing. -->
    <a class="go" id="go" href="https://search.google.com/local/writereview?placeid=ChIJfXEeU5lUCYgRinSXcUIjYX0">Leave a review</a>
  </div>
<script>
  /**
   * Where this sends people.
   *
   * `?u=` lets App setup's review link travel through here, so changing that
   * link stays a script property rather than a commit. It is checked against
   * the two shapes a Google review box is ever served at, and anything else
   * falls back to the shop's own — an unchecked redirector on the shop's
   * domain is a phishing link with the shop's name on it, and this page is
   * reachable by anybody who can type a URL.
   */
  var DEFAULT_URL = 'https://search.google.com/local/writereview?placeid=ChIJfXEeU5lUCYgRinSXcUIjYX0';
  var ALLOWED = [
    /^https:\/\/search\.google\.com\/local\/writereview\?placeid=[A-Za-z0-9_-]+$/,
    /^https:\/\/g\.page\/r\/[A-Za-z0-9_-]+\/review$/
  ];

  var asked = '';
  try {
    asked = new URLSearchParams(window.location.search).get('u') || '';
  } catch (err) {
    asked = '';
  }

  var target = DEFAULT_URL;
  for (var i = 0; i < ALLOWED.length; i++) {
    if (ALLOWED[i].test(asked)) { target = asked; break; }
  }

  document.getElementById('go').href = target;
  // replace, not assign: Back from Google should return to the email, not to
  // this page, which would bounce them straight to Google again.
  window.location.replace(target);
</script>
</body>
</html>
